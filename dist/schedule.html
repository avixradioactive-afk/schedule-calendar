    var dirty = Sched.state.lastSeq !== cfg.syncedSeq && localHasData;

    if (!cloud) {
      // 文件还没有。本地有东西就建，没有就等
      return localHasData ? 'push-create' : 'nothing';
    }
    if (clean) {
      return dirty ? 'push' : 'nothing';
    }
    if (dirty) {
      // 两边都变了。永远不自动选谁赢——由人来看清楚再决定。
      return 'conflict';
    }
    // 本地没有未同步的改动，采纳云端丢不了东西
    if ((+cloud.state.version || 1) > Sched.VERSION) return 'app-older';
    if (countItems(cloud.state) === 0 && localHasData) return 'suspect-empty';
    return 'adopt';
  }

  function adoptCloud(cloud) {
    selfWrite = true;
    try { Sched.adopt(cloud.state); }
    finally { selfWrite = false; }
    cfg.baseSha = cloud.sha;
    cfg.syncedSeq = cloud.state.lastSeq || null;
    saveCfg();
  }

  /* ── 拉取 ────────────────────────────────────────────────── */

  function pull() {
    if (!isConfigured()) return Promise.resolve('off');
    if (!canAdopt()) return Promise.resolve('busy-dialog');

    setStatus('syncing', '正在检查云端…');
    return probeRepo()
      .then(fetchCloud)
      .then(function (cloud) {
        var act = decide(cloud);

        if (act === 'nothing') { done('已是最新'); return 'nothing'; }

        // 云端还没有文件、本地有东西：直接把文件建出来。
        // 不能只挂个「待推送」了事——新设备配好之后往往不会再改任何东西，
        // 光等「改动触发推送」的话，文件永远建不出来。
        if (act === 'push-create') return createCloud();
        if (act === 'push') { setStatus('idle', '有本地改动待推送'); return 'pending-push'; }

        if (act === 'app-older') {
          throw err('app-older', '云端数据是这个页面还不认识的新版本。' +
            '请先更新应用（手机上的 APK 也需要重装），再同步——' +
            '现在推上去会把新版本才有的字段抹掉。');
        }
        if (act === 'suspect-empty') {
          throw err('suspect-empty', '云端那份是空的，本地却有数据。' +
            '没有自动覆盖——请确认云端仓库里的 schedule.json 是不是被清过。');
        }
        if (act === 'conflict') {
          pending = { cloud: cloud };
          failures = 0;
          setStatus('conflict', '两边都改过，需要你选一下');
          return 'conflict';
        }

        adoptCloud(cloud);
        done('已从云端拉取');
        return 'adopt';
      })
      .catch(function (e) { fail(e); return 'error'; });
  }

  function done(msg) {
    failures = 0;
    cfg.lastError = '';
    cfg.lastSyncAt = Date.now();
    saveCfg();
    setStatus('idle', msg);
  }

  /* ── 推送 ────────────────────────────────────────────────── */

  /** 云端还没有文件：建出来（不带 sha） */
  function createCloud() {
    var text = Sched.serialize();
    var sentSeq = Sched.state.lastSeq;
    setStatus('syncing', '正在上传…');
    return sendCloud(text, '')
      .then(function (newSha) {
        cfg.baseSha = newSha;
        cfg.syncedSeq = sentSeq;
        lastPushAt = Date.now();
        done('已同步到云端');
        return 'pushed';
      })
      .catch(function (e) { fail(e); return 'error'; });
  }

  /**
   * 云端不再是我基于的那一版：先看清它到底是什么，再决定怎么办。
   * 不直接重试推送——拿着旧 sha 重试只会又撞一次，然后弹一个
   * 「自己跟自己」的冲突窗。
   */
  function resyncThenMaybePush() {
    cfg.baseSha = '';
    saveCfg();
    return fetchCloud().then(function (cloud) {
      var localHasData = countItems(Sched.state) > 0;

      // 文件被人删了：直接重建
      if (!cloud) return localHasData ? createCloud() : Promise.resolve('nothing');

      var act = decide(cloud);
      if (act === 'conflict') {
        pending = { cloud: cloud };
        setStatus('conflict', '两边都改过，需要你选一下');
        return 'conflict';
      }
      if (act === 'adopt') {
        adoptCloud(cloud);
        done('已从云端拉取');
        return 'adopt';
      }
      if (act === 'app-older') {
        throw err('app-older', '云端数据是这个页面还不认识的新版本，请先更新应用再同步。');
      }
      if (act === 'suspect-empty') {
        throw err('suspect-empty', '云端那份是空的，本地却有数据。没有自动覆盖——' +
          '请确认仓库里的 schedule.json 是不是被清过。');
      }
      return 'nothing';   // 云端的版本和我这次要写的对不上，但没有本地改动，等下次
    }).catch(function (e) { fail(e); return 'error'; });
  }

  function push(isManual) {
    if (!isConfigured()) return Promise.resolve('off');
    if (!canAdopt()) return Promise.resolve('busy-dialog');

    var text = Sched.serialize();
    var sentSeq = Sched.state.lastSeq;
    var items = countItems(Sched.state);

    // 「把整个日历清空」这种事不该自动推上去——多半是误操作。
    // 手动点「立即同步」仍然可以，那时用户是清醒的。
    if (!isManual && items === 0 && cfg.syncedSeq) {
      setStatus('idle', '本地是空的，没有自动推送（要清空云端请点「立即同步」）');
      return Promise.resolve('skip-empty');
    }

    setStatus('syncing', '正在上传…');
    var sha = cfg.baseSha || '';

    // 先把这次要写的 seq 记下来：万一响应丢了但其实写成功了，
    // 下次能凭它认出「那是我的写入」而不是别人的改动
    cfg.pushedSeq = sentSeq;
    saveCfg();

    return sendCloud(text, sha)
      .then(function (newSha) {
        cfg.baseSha = newSha;
        cfg.syncedSeq = sentSeq;
        lastPushAt = Date.now();
        done('已同步到云端');
        return 'pushed';
      })
      .catch(function (e) {
        // 仓库一次提交都没有：不带 sha 再发一次就好
        if (e.kind === 'repo-empty') {
          return sendCloud(text, '')
            .then(function (newSha) {
              cfg.baseSha = newSha;
              cfg.syncedSeq = sentSeq;
              lastPushAt = Date.now();
              done('已同步到云端');
              return 'pushed';
            })
            .catch(function (e2) { fail(e2); return 'error'; });
        }

        var retryable = e.kind === 'http' || e.kind === 'conflict' || e.kind === 'stale-sha';
        if (retryable) {
          // 请求发出去了但没收到回应：服务端可能其实已经写成功了。
          // 先认一下云端那份是不是我自己刚发的，别自己跟自己报冲突。
          return recoverAfterFailedPush(sentSeq, text).then(function (recovered) {
            if (recovered) { done('已同步到云端'); return 'pushed'; }
            if (e.kind === 'http') { fail(e); return 'error'; }
            return resyncThenMaybePush();
          });
        }

        fail(e);
        return 'error';
      });
  }

  /** 推送失败后：云端那份是不是恰好就是我自己刚发的那次？ */
  function recoverAfterFailedPush(sentSeq, text) {
    return fetchCloud().then(function (cloud) {
      if (!cloud) return false;
      if (cloud.state.lastWriter === writerId && cloud.state.lastSeq === sentSeq) {
        cfg.baseSha = cloud.sha;
        cfg.syncedSeq = sentSeq;
        lastPushAt = Date.now();
        return true;
      }
      // 内容一模一样也算成功（比如另一个标签页替我推了同一份）
      if (cloud.text === text) {
        cfg.baseSha = cloud.sha;
        cfg.syncedSeq = sentSeq;
        lastPushAt = Date.now();
        return true;
      }
      return false;
    }).catch(function () { return false; });
  }

  /* ── 冲突处理 ────────────────────────────────────────────── */

  /**
   * @param {string} choice 'cloud' 用云端的 / 'local' 用本地的 / 'both' 都要
   *   'both' = 采纳云端，同时把本地那份备份下来并提示下载（唯一不会丢数据的选项）
   */
  function resolveConflict(choice) {
    if (!pending) return Promise.resolve('none');
    var cloud = pending.cloud;
    pending = null;

    var localSnapshot = JSON.parse(Sched.serialize());

    if (choice === 'cloud' || choice === 'both') {
      var key = stash(choice === 'both' ? '冲突：保留了本地那份' : '冲突：选择了云端', localSnapshot);
      if (!key) {
        // 备份都写不下，就别再覆盖了
        pending = { cloud: cloud };
        var e = err('stash', '本地存储写不进去，没法备份，所以没有覆盖任何东西。请先清理浏览器存储再试。');
        fail(e);
        return Promise.resolve('error');
      }
      adoptCloud(cloud);
      // 采纳之后本地那份要推上去吗？'both' 的语义是「别丢」，
      // 而本地那份已经安全地躺在备份里了，云端保持原样即可。
      failures = 0;
      setStatus('idle', choice === 'both' ? '已用云端的，本地那份已备份' : '已用云端的');
      cfg.lastSyncAt = Date.now();
      saveCfg();
      return Promise.resolve('resolved-cloud');
    }

    // 用本地的：带上云端的 sha 推上去，覆盖它
    var key2 = stash('冲突：用本地覆盖了云端', cloud.state);
    if (!key2) {
      pending = { cloud: cloud };
      fail(err('stash', '本地存储写不进去，没法备份云端那份，所以什么都没做。'));
      return Promise.resolve('error');
    }
    cfg.baseSha = cloud.sha;    // 关键：对准「我刚否掉的那一版」，
                                // 否则 PUT 会 412，然后又弹一遍同一个冲突
    saveCfg();
    return push(true);
  }

  /* ── 同步入口 ────────────────────────────────────────────── */

  /** 先把手头没推的改动推上去，再拉。顺序反了会拿云端盖掉本地没推的改动。 */
  function syncNow() {
    if (!isConfigured()) return Promise.resolve('off');
    if (busy) return Promise.resolve('busy');
    busy = true;
    var had = pending;
    pending = null;
    return Promise.resolve()
      .then(function () { return had ? 'conflict-pending' : null; })
      .then(function (x) {
        if (x) { pending = had; setStatus('conflict', '有冲突还没处理'); return x; }
        var dirty = Sched.state.lastSeq !== cfg.syncedSeq;
        return dirty ? push(true) : null;
      })
      .then(function () { return pull(); })
      .then(function (r) { busy = false; return r; })
      .catch(function (e) { busy = false; fail(e); return 'error'; });
  }

  /* ── 定时器 / 多标签页 ───────────────────────────────────── */

  /** 只有拿到租约的标签页才轮询和推送，免得两个标签页各推各的 */
  function hasLease() {
    var lock = readJSON(LOCKKEY);
    var now = Date.now();
    if (!lock || !lock.tab || lock.expires < now || lock.tab === tabId) {
      writeJSON(LOCKKEY, { tab: tabId, expires: now + LOCK_MS });
      return true;
    }
    return false;
  }

  function every(ms, fn) {
    var t = setInterval(function () {
      if (typeof document !== 'undefined' && document.hidden) return;
      if (!hasLease()) return;
      fn();
    }, ms);
    timers.push(t);
    return t;
  }

  function stopTimers() {
    timers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
    timers = [];
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    started = false;
  }

  /** 本地改了东西：停手一段时间后再推，避免几百个 commit */
  function schedulePush() {
    if (!isConfigured()) return;
    if (pushTimer) clearTimeout(pushTimer);
    var wait = Math.max(PUSH_IDLE_MS, lastPushAt + PUSH_MIN_MS - Date.now());
    pushTimer = setTimeout(function () {
      pushTimer = null;
      if (!hasLease()) return;
      push(false);
    }, wait);
  }

  function flushPush() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (!isConfigured()) return Promise.resolve('off');
    if (Sched.state.lastSeq === cfg.syncedSeq) return Promise.resolve('clean');
    if (!hasLease()) return Promise.resolve('no-lease');
    return push(false);
  }

  function start() {
    if (started || !isConfigured()) return;
    started = true;
    every(POLL_MS, function () { pull(); });
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { flushPush(); return; }   // 切走前先把改动送出去
        if (hasLease()) pull();
      });
    }
  }

  function init(opts) {
    opts = opts || {};
    if (opts.transport) useTransport(opts.transport);
    if (opts.canAdopt) canAdopt = opts.canAdopt;
    initDevice();
    cfg = readJSON(CFGKEY);
    if (cfg) {
      if (cfg.syncedSeq === undefined) cfg.syncedSeq = null;
      if (cfg.baseSha === undefined) cfg.baseSha = '';
      if (cfg.pushedSeq === undefined) cfg.pushedSeq = '';
      setStatus('idle', '已连接');
      Sched.onChange(function () { if (!selfWrite) schedulePush(); });
    } else {
      setStatus('off', '');
    }
    return cfg;
  }

  /* ── 对外 ────────────────────────────────────────────────── */

  return {
    FILE: FILE,
    CFGKEY: CFGKEY,
    BAKKEY: BAKKEY,

    init: init,
    start: start,
    stop: stopTimers,
    useTransport: useTransport,

    configure: configure,
    disconnect: disconnect,
    isConfigured: isConfigured,
    get config() { return cfg; },
    get status() { return status; },
    get conflict() { return pending; },
    get myWriterId() { return writerId; },
    onStatus: onStatus,

    pull: pull,
    push: push,
    syncNow: syncNow,
    resolveConflict: resolveConflict,
    flushPush: flushPush,

    probeRepo: probeRepo,
    lastBackup: lastBackup,
    stash: stash,

    // 给测试用的内部件
    _decide: decide,
    _b64: { strToB64: strToB64, b64ToStr: b64ToStr, utf8Bytes: utf8Bytes, bytesToB64: bytesToB64 }
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Sync;

</script>
<script>
/* ══════════════════════════════════════════════════════════
   month.js — 月历视图
   ══════════════════════════════════════════════════════════ */

var Month = (function () {
  'use strict';

  var gridEl, titleEl, weekBadgeEl, weekdaysEl;
  var today = new Date();
  var todayStr = Sched.ymd(today);

  var view = { y: today.getFullYear(), m: today.getMonth() };
  var selected = todayStr;
  var onChangeSelect = null;   // 由 app.js 注入：点某天时打开当日面板

  /* ── 初始化 ── */

  function init(opts) {
    gridEl = document.getElementById('grid');
    titleEl = document.getElementById('mtitle');
    weekBadgeEl = document.getElementById('week-badge');
    weekdaysEl = document.getElementById('weekdays');
    onChangeSelect = opts && opts.onSelect;

    renderWeekdays();

    // 窗口/面板尺寸变化时重新计算每格能塞几条
    var ro = new ResizeObserver(function () { fitAll(); });
    ro.observe(gridEl);
    // 主题切换的重绘统一由 app.js 的 initThemeWatch 负责，这里不重复挂
  }

  function renderWeekdays() {
    var html = '';
    for (var i = 0; i < 7; i++) {
      html += '<span class="' + (i >= 5 ? 'we' : '') + '">' +
              Sched.WEEKDAY_CN[i] + '</span>';
    }
    weekdaysEl.innerHTML = html;
  }

  /* ── 渲染 ── */

  function render() {
    var y = view.y, m = view.m;
    titleEl.textContent = y + ' 年 ' + (m + 1) + ' 月';

    var wn = Sched.weekNumber(Sched.ymd(new Date(y, m, 1)));
    weekBadgeEl.textContent = wn > 0 ? '第 ' + wn + ' 周起' : '';

    // 网格范围：本月 1 号所在周的周一开始，铺满整周
    var first = new Date(y, m, 1);
    var start = Sched.mondayOf(first);
    var last = new Date(y, m + 1, 0);
    var end = Sched.addDays(Sched.mondayOf(last), 6);
    var days = Math.round((end - start) / 86400000) + 1;
    var rows = days / 7;

    gridEl.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';

    var onlyImp = Sched.ui.onlyImportant;
    var html = '';
    var d = new Date(start);

    for (var i = 0; i < days; i++) {
      html += cellHTML(d, d.getMonth() === m, Sched.ymd(d) === todayStr, onlyImp);
      d = Sched.addDays(d, 1);
    }

    gridEl.innerHTML = html;

    // 事件条的颜色靠内联 CSS 变量，必须在插进 DOM 之后逐条设置
    var chips = gridEl.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) {
      Sched.applyColors(chips[c], chips[c].dataset.color);
    }

    requestAnimationFrame(fitAll);
  }

  function cellHTML(d, inMonth, isToday, onlyImp) {
    var ds = Sched.ymd(d);
    var evs = Sched.eventsOn(ds);

    if (onlyImp) evs = evs.filter(function (e) { return e.important; });

    // 重要的排前面，其余按时间
    evs = evs.slice().sort(function (a, b) {
      if (a.important !== b.important) return a.important ? -1 : 1;
      return Sched.toMin(a.start) - Sched.toMin(b.start);
    });

    var cls = 'cell' + (inMonth ? '' : ' other') +
              (isToday ? ' today' : '') +
              (ds === selected ? ' selected' : '');

    var chips = evs.map(function (e) {
      return '<div class="chip' + (e.important ? ' important' : '') +
             (e.done ? ' done' : '') + '"' +
             ' data-id="' + e.id + '" data-color="' + Sched.esc(e.color) + '"' +
             ' draggable="true" title="' +
             Sched.esc(e.start + '–' + e.end + '  ' + e.title + (e.note ? '\n' + e.note : '')) + '">' +
             '<span class="t">' + Sched.esc(e.start) + '</span>' +
             '<span class="n">' + Sched.esc(e.title) + '</span>' +
             '<button type="button" class="chip-chk" data-chk="' + e.id + '"' +
               ' title="' + (e.done ? '取消完成' : '标记完成') + '">✓</button>' +
             '</div>';
    }).join('');

    return '<div class="' + cls + '" data-date="' + ds + '">' +
             '<div class="cell-head">' +
               '<span class="dnum">' + d.getDate() + '</span>' +
               '<span class="spacer"></span>' +
               '<button class="add-btn" data-add="' + ds + '" title="快速添加">+</button>' +
             '</div>' +
             '<div class="cell-events">' + chips + '</div>' +
             '<div class="more" hidden></div>' +
           '</div>';
  }

  /* ── 溢出处理：算出每格能显示几条 ── */

  function fitAll() {
    var cells = gridEl.querySelectorAll('.cell');
    for (var i = 0; i < cells.length; i++) fitCell(cells[i]);
  }

  function fitCell(cell) {
    var list = cell.querySelector('.cell-events');
    var more = cell.querySelector('.more');
    var chips = list.querySelectorAll('.chip');

    if (!chips.length) { more.hidden = true; return; }

    var avail = list.clientHeight;
    if (avail <= 0) return;

    var GAP = 3;
    var i;

    // 先把所有小条显示出来，把真实高度量下来缓存住。
    // （隐藏的元素 offsetHeight 是 0，边量边藏会算错。）
    var heights = [];
    for (i = 0; i < chips.length; i++) {
      chips[i].hidden = false;
      heights.push(chips[i].offsetHeight);
    }

    // "+N" 的高度也要先显示才能量到
    more.hidden = false;
    more.textContent = '+0 更多';
    var moreH = more.offsetHeight + GAP;
    more.hidden = true;

    // 第一轮：不留 "+N" 的位置
    var used = 0, hidden = 0;
    for (i = 0; i < chips.length; i++) {
      var h = heights[i] + (used > 0 ? GAP : 0);
      if (used + h <= avail) { used += h; }
      else { chips[i].hidden = true; hidden++; }
    }

    if (hidden === 0) return;

    // 第二轮：腾出一行给 "+N"
    used = 0; hidden = 0;
    for (i = 0; i < chips.length; i++) {
      var h2 = heights[i] + (used > 0 ? GAP : 0);
      if (used + h2 + moreH <= avail) { chips[i].hidden = false; used += h2; }
      else { chips[i].hidden = true; hidden++; }
    }

    if (hidden > 0) {
      more.textContent = '+' + hidden + ' 更多';
      more.hidden = false;
    }
  }

  /* ── 快速添加（在格子里直接输入）── */

  function quickAdd(cell) {
    var list = cell.querySelector('.cell-events');
    if (list.querySelector('.quick')) return;

    var input = document.createElement('input');
    input.className = 'quick';
    input.placeholder = '输入标题，回车保存';
    input.maxLength = 80;
    list.appendChild(input);
    input.focus();

    // 回车提交时 input.remove() 会同步触发 blur，不加锁的话会存两条
    var done = false;
    var commit = function (save) {
      if (done) return;
      done = true;
      var v = input.value.trim();
      input.remove();
      if (save && v) {
        var ds = cell.dataset.date;
        var t = defaultTimeFor(ds);
        Sched.addEvent({
          date: ds, start: t.start, end: t.end, title: v,
          color: 'blue', important: false
        });
      }
      fitAll();
    };

    input.addEventListener('keydown', function (ev) {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', function () { commit(true); });
    input.addEventListener('click', function (ev) { ev.stopPropagation(); });
  }

  /** 默认时间：今天取下一个整点，其它日子取 09:00 */
  function defaultTimeFor(ds) {
    var now = new Date();
    if (ds === Sched.ymd(now)) {
      var h = Math.min(now.getHours() + 1, 22);
      return { start: Sched.pad(h) + ':00', end: Sched.pad(h + 1) + ':00' };
    }
    return { start: '09:00', end: '10:00' };
  }

  /* ── 交互 ── */

  function bind() {
    gridEl.addEventListener('click', function (ev) {
      var addBtn = ev.target.closest('[data-add]');
      if (addBtn) {
        ev.stopPropagation();
        quickAdd(addBtn.closest('.cell'));
        return;
      }

      var more = ev.target.closest('.more');
      var chip = ev.target.closest('.chip');

      // 小圈：只切换完成状态，不打开编辑弹窗
      var chk = ev.target.closest('[data-chk]');
      if (chk) {
        ev.stopPropagation();
        Sched.toggleEventDone(chk.dataset.chk);
        return;
      }

      if (chip) {
        ev.stopPropagation();
        var id = chip.dataset.id;
        var e = Sched.getEvent(id);
        if (e) select(e.date);
        document.dispatchEvent(new CustomEvent('sched:edit-event', { detail: id }));
        return;
      }

      var cell = ev.target.closest('.cell');
      if (!cell) return;
      select(cell.dataset.date);
      if (more) return;   // 点 "+N" 只展开，不额外做事
    });

    gridEl.addEventListener('dblclick', function (ev) {
      var cell = ev.target.closest('.cell');
      if (!cell || ev.target.closest('.chip')) return;
      quickAdd(cell);
    });

    // 拖拽事件到别的日子 = 改期
    var dragId = null;

    gridEl.addEventListener('dragstart', function (ev) {
      var chip = ev.target.closest('.chip');
      if (!chip) return;
      dragId = chip.dataset.id;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', dragId);
    });

    gridEl.addEventListener('dragover', function (ev) {
      if (!dragId) return;
      var cell = ev.target.closest('.cell');
      if (!cell) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'move';
      var prev = gridEl.querySelector('.cell.dragover');
      if (prev && prev !== cell) prev.classList.remove('dragover');
      cell.classList.add('dragover');
    });

    gridEl.addEventListener('dragleave', function (ev) {
      var cell = ev.target.closest('.cell');
      if (cell) cell.classList.remove('dragover');
    });

    gridEl.addEventListener('drop', function (ev) {
      var cell = ev.target.closest('.cell');
      if (!cell || !dragId) return;
      ev.preventDefault();
      cell.classList.remove('dragover');
      var id = dragId;
      dragId = null;
      var e = Sched.getEvent(id);
      if (e && e.date !== cell.dataset.date) {
        Sched.updateEvent(id, { date: cell.dataset.date });
        App.toast('已移到 ' + cell.dataset.date);
      }
    });

    gridEl.addEventListener('dragend', function () {
      dragId = null;
      var prev = gridEl.querySelector('.cell.dragover');
      if (prev) prev.classList.remove('dragover');
    });
  }

  /* ── 导航 ── */

  function select(dateStr) {
    selected = dateStr;
    var cells = gridEl.querySelectorAll('.cell');
    for (var i = 0; i < cells.length; i++) {
      cells[i].classList.toggle('selected', cells[i].dataset.date === dateStr);
    }
    if (onChangeSelect) onChangeSelect(dateStr);
  }

  /** 月份可以越界，交给 Date 进位（13 月 = 次年 1 月） */
  function goto(y, m) {
    var d = new Date(y, m, 1);
    view.y = d.getFullYear();
    view.m = d.getMonth();
    render();
  }

  function shift(delta) {
    var d = new Date(view.y, view.m + delta, 1);
    goto(d.getFullYear(), d.getMonth());
  }

  function gotoToday() {
    var n = new Date();
    view.y = n.getFullYear();
    view.m = n.getMonth();
    render();
    select(Sched.ymd(n));
  }

  function gotoDate(dateStr) {
    var d = Sched.parseYmd(dateStr);
    if (d.getFullYear() !== view.y || d.getMonth() !== view.m) {
      goto(d.getFullYear(), d.getMonth());
    }
    select(dateStr);
  }

  function getSelected() { return selected; }
  function getView() { return { y: view.y, m: view.m }; }

  return {
    init: init, render: render, bind: bind,
    select: select, goto: goto, shift: shift,
    gotoToday: gotoToday, gotoDate: gotoDate,
    getSelected: getSelected, getView: getView,
    fitAll: fitAll
  };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   day.js — 当日面板（按小时展开的时间轴）
   ══════════════════════════════════════════════════════════ */

var Day = (function () {
  'use strict';

  var panel, bodyEl, scrollEl, hoursEl, eventsEl, nowEl, dateEl, subEl;
  var memoListEl, memoCountEl, memoInputEl;
  var current = null;       // 当前显示的日期 YYYY-MM-DD
  var HOUR_H = 58;
  var SNAP = 15;            // 点击空白处新建时，时间吸附到 15 分钟
  var nowTimer = null;

  function init() {
    panel    = document.getElementById('daypanel');
    bodyEl   = document.getElementById('dp-body');
    scrollEl = document.getElementById('dp-tl');
    hoursEl  = document.getElementById('tl-hours');
    eventsEl = document.getElementById('tl-events');
    nowEl    = document.getElementById('tl-now');
    dateEl   = document.getElementById('dp-date');
    subEl    = document.getElementById('dp-sub');

    memoListEl  = document.getElementById('dp-memo-list');
    memoCountEl = document.getElementById('dp-memo-c');
    memoInputEl = document.getElementById('memo-input');

    HOUR_H = parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--hour-h')
    ) || 58;

    buildHours();

    document.getElementById('dp-close').addEventListener('click', close);
    document.getElementById('dp-add').addEventListener('click', function () {
      if (!current) return;
      var t = suggestTime(current);
      document.dispatchEvent(new CustomEvent('sched:new-event', {
        detail: { date: current, start: t.start, end: t.end }
      }));
    });

    // 备忘录区：委托挂一次，render 只换 #dp-memo-list 里的内容
    Todo.bind(memoListEl);

    document.getElementById('form-memo').addEventListener('submit', function (ev) {
      ev.preventDefault();
      addMemo();
    });
    memoInputEl.addEventListener('keydown', function (ev) { ev.stopPropagation(); });

    // 点时间轴空白 → 在该时刻新建。
    // 以 eventsEl 的顶边为 0 点，这样不受容器 padding / 滚动的影响。
    // 只认落在时间轴里的点击：备忘录区和「加提醒」输入框跟时间轴同在
    // .dp-body 里，不挡一下的话，勾个提醒也会顺手新建一条日程。
    bodyEl.addEventListener('click', function (ev) {
      if (!ev.target.closest('#dp-tl')) return;
      if (ev.target.closest('.ev-block')) return;
      if (!current) return;
      var y = ev.clientY - eventsEl.getBoundingClientRect().top;
      var min = Math.max(0, Math.min(1425, Math.round((y / HOUR_H * 60) / SNAP) * SNAP));
      document.dispatchEvent(new CustomEvent('sched:new-event', {
        detail: { date: current, start: Sched.minToTime(min), end: Sched.minToTime(min + 60) }
      }));
    });

    // 点已有日程 → 编辑；点块上的小圈 → 只切换完成状态
    eventsEl.addEventListener('click', function (ev) {
      var chk = ev.target.closest('[data-chk]');
      if (chk) {
        ev.stopPropagation();
        Sched.toggleEventDone(chk.dataset.chk);
        return;
      }
      var blk = ev.target.closest('.ev-block');
      if (!blk) return;
      ev.stopPropagation();
      document.dispatchEvent(new CustomEvent('sched:edit-event', { detail: blk.dataset.id }));
    });

    eventsEl.addEventListener('dblclick', function (ev) { ev.stopPropagation(); });

    // 每分钟刷新"现在"红线
    nowTimer = setInterval(tickNow, 30000);
  }

  function buildHours() {
    var h = '';
    for (var i = 0; i < 24; i++) {
      h += '<div class="tl-hour"><span>' + Sched.pad(i) + ':00</span></div>';
    }
    hoursEl.innerHTML = h;
    eventsEl.style.height = (24 * HOUR_H) + 'px';
    eventsEl.style.top = '10px';
  }

  /* ── 开关 ── */

  function open(dateStr, opts) {
    panel.hidden = false;
    show(dateStr, opts);
  }

  function close() {
    panel.hidden = true;
  }

  function isOpen() { return !panel.hidden; }

  function show(dateStr, opts) {
    current = dateStr;
    render();
    if (opts && opts.keepScroll) return;
    scrollToSensible();
  }

  function scrollToSensible() {
    var target;
    if (current === Sched.ymd(new Date())) {
      var now = new Date();
      target = (now.getHours() + now.getMinutes() / 60) * HOUR_H - scrollEl.clientHeight * 0.35;
    } else {
      target = 7 * HOUR_H;
    }
    scrollEl.scrollTop = Math.max(0, Math.min(target, scrollEl.scrollHeight));
  }

  /* ── 渲染 ── */

  function render() {
    if (!current) return;

    var d = Sched.parseYmd(current);
    var wd = Sched.weekdayIndex(d);
    var wn = Sched.weekNumber(current);

    dateEl.textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 周' + Sched.WEEKDAY_CN[wd];

    var subs = [];
    if (current === Sched.ymd(new Date())) subs.push('今天');
    if (wn > 0) subs.push('第 ' + wn + ' 教学周');
    var evs = Sched.eventsOn(current);
    var total = evs.reduce(function (s, e) {
      return s + Math.max(0, Sched.toMin(e.end) - Sched.toMin(e.start));
    }, 0);
    if (evs.length) {
      subs.push(evs.length + ' 项 · 共 ' + (Math.round(total / 6) / 10) + ' 小时');
    }
    subEl.textContent = subs.join(' · ');

    eventsEl.innerHTML = evs.length
      ? renderBlocks(evs)
      : '<div class="dp-empty">这一天还没有安排。<br>点左边任意时刻，或按 N 新建。</div>';

    renderMemos();

    // 颜色要用元素上的 data-color 解析，所以插进 DOM 之后再上色
    var blocks = eventsEl.querySelectorAll('.ev-block');
    for (var i = 0; i < blocks.length; i++) {
      Sched.applyColors(blocks[i], blocks[i].dataset.color);
    }

    tickNow();
  }

  /* ── 备忘录区 ────────────────────────────────────────────── */

  function renderMemos() {
    var memos = Sched.memosOn(current);
    var left = memos.filter(function (m) { return !m.done; }).length;

    memoCountEl.textContent = memos.length
      ? (left ? left + ' 件没做' : '全部完成')
      : '';

    memoListEl.innerHTML = memos.length
      ? memos.map(function (m) {
          return Todo.rowHTML({ ref: 'memo:' + m.id, text: m.text, done: m.done });
        }).join('')
      : '<p class="memo-empty">记点小事：要交的材料、要回的消息…</p>';
  }

  function addMemo() {
    var v = memoInputEl.value.trim();
    if (!v || !current) return;
    Sched.addMemo({ date: current, text: v });
    memoInputEl.value = '';
    App.toast('已添加提醒');
  }

  /**
   * 时间轴上的块。
   * 重叠的日程用「泳道」错开：先按开始时间分组，一组里每条找第一条空泳道。
   */
  function renderBlocks(evs) {
    var items = evs.map(function (e) {
      var s = Sched.toMin(e.start);
      var t = Math.max(Sched.toMin(e.end), s + 15);
      return { e: e, s: s, t: t };
    }).sort(function (a, b) { return a.s - b.s || b.t - a.t; });

    // 分成互相重叠的簇
    var clusters = [], cur = null;
    items.forEach(function (it) {
      if (!cur || it.s >= cur.end) { cur = { end: it.t, items: [] }; clusters.push(cur); }
      cur.items.push(it);
      cur.end = Math.max(cur.end, it.t);
    });

    clusters.forEach(function (cl) {
      var laneEnds = [];
      cl.items.forEach(function (it) {
        var li = -1;
        for (var i = 0; i < laneEnds.length; i++) {
          if (laneEnds[i] <= it.s) { li = i; break; }
        }
        if (li === -1) { li = laneEnds.length; laneEnds.push(0); }
        laneEnds[li] = it.t;
        it.lane = li;
      });
      cl.lanes = laneEnds.length;
    });

    var html = '';
    clusters.forEach(function (cl) {
      cl.items.forEach(function (it) {
        var e = it.e;
        var top = it.s / 60 * HOUR_H;
        var h = Math.max(20, (it.t - it.s) / 60 * HOUR_H - 3);
        var wPct = 100 / cl.lanes;
        var left = it.lane * wPct;
        var cls = 'ev-block' + (h < 46 ? ' short' : '') + (e.done ? ' done' : '');

        html += '<div class="' + cls + '" data-id="' + e.id + '"' +
                ' style="top:' + top.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px;' +
                'left:calc(' + left.toFixed(3) + '% + ' + (it.lane ? 3 : 0) + 'px);' +
                'width:calc(' + wPct.toFixed(3) + '% - 4px)"' +
                ' data-color="' + Sched.esc(e.color) + '"' +
                ' title="' + Sched.esc(e.start + '–' + e.end + '  ' + e.title + (e.note ? '\n' + e.note : '')) + '">' +
                '<button type="button" class="eb-chk" data-chk="' + e.id + '"' +
                  ' title="' + (e.done ? '取消完成' : '标记完成') + '"' +
                  ' aria-pressed="' + (e.done ? 'true' : 'false') + '">✓</button>' +
                '<div class="eb-c">' +
                  '<div class="eb-t">' + Sched.esc(e.title) + '</div>' +
                  (h >= 46
                    ? '<div class="eb-m">' + Sched.esc(e.start + '–' + e.end) +
                      (e.note ? ' · ' + Sched.esc(e.note) : '') + '</div>'
                    : '<div class="eb-m">' + Sched.esc(e.start) + '</div>') +
                '</div>' +
                '</div>';
      });
    });

    return html;
  }

  function tickNow() {
    if (!current) { nowEl.hidden = true; return; }
    if (current !== Sched.ymd(new Date())) { nowEl.hidden = true; return; }

    var now = new Date();
    var min = now.getHours() * 60 + now.getMinutes();
    nowEl.hidden = false;
    nowEl.style.top = (10 + min / 60 * HOUR_H) + 'px';
  }

  /** 空白处新建时的建议时间：今天取当前时刻之后，其它日子取 09:00 */
  function suggestTime(dateStr) {
    if (dateStr === Sched.ymd(new Date())) {
      var now = new Date();
      var m = Math.ceil((now.getHours() * 60 + now.getMinutes()) / SNAP) * SNAP;
      m = Math.min(m, 1380);
      return { start: Sched.minToTime(m), end: Sched.minToTime(m + 60) };
    }
    return { start: '09:00', end: '10:00' };
  }

  return {
    init: init, open: open, close: close, show: show,
    render: render, isOpen: isOpen, getDate: function () { return current; }
  };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   tasks.js — 左侧任务栏：这一天要做的所有事
   提醒（备忘录）+ 当天的日程，都能直接勾掉。
   ══════════════════════════════════════════════════════════ */

var Tasks = (function () {
  'use strict';

  var panel, dateEl, subEl, bodyEl, inputEl;
  var current = null;      // 当前显示的日期，跟着月历选中日走
  var tucked = false;      // 窄屏上临时收起（不动设置里的偏好）

  /* 和 CSS 里的 @media (max-width: 900px) 是同一个断点；
     CSS 媒体查询没法跟 JS 共用常量，改一处记得改另一处。 */
  function isNarrow() {
    return typeof matchMedia !== 'undefined' && matchMedia('(max-width: 900px)').matches;
  }

  function init() {
    panel   = document.getElementById('taskpanel');
    dateEl  = document.getElementById('tp-date');
    subEl   = document.getElementById('tp-sub');
    bodyEl  = document.getElementById('tp-body');
    inputEl = document.getElementById('tp-input');

    // 委托挂一次就够，render 只换 innerHTML
    Todo.bind(bodyEl);

    document.getElementById('tp-hide').addEventListener('click', function () {
      Sched.ui.showTasks = false;
      Sched.saveUi();
      render();
    });

    document.getElementById('form-tpadd').addEventListener('submit', function (ev) {
      ev.preventDefault();
      addMemo();
    });
    // 输入框里敲字时别触发全局快捷键
    inputEl.addEventListener('keydown', function (ev) { ev.stopPropagation(); });

    render();
  }

  function show(dateStr) {
    current = dateStr || Sched.ymd(new Date());
    // 窄屏上这一栏是盖住日历的抽屉，选完日子就自动让开。
    // 只是临时收起，设置里的偏好留着——回到大屏还要原样展开。
    if (isNarrow()) tucked = true;
    render();
  }

  function toggle() {
    // 看的是「现在实际显示没有」，而不是存下来的值：
    // 窄屏上可能已经被自动收起了，存着的却还是 true。
    Sched.ui.showTasks = panel.hidden;
    tucked = false;
    Sched.saveUi();
    render();
    if (Sched.ui.showTasks && inputEl) inputEl.focus();
  }

  /* ── 渲染 ── */

  function render() {
    applyVisible();
    if (!current) return;

    var d = Sched.parseYmd(current);
    var isToday = current === Sched.ymd(new Date());
    dateEl.textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 周' +
                         Sched.WEEKDAY_CN[Sched.weekdayIndex(d)];

    var open = [], done = [];
    Sched.memosOn(current).forEach(function (m) {
      (m.done ? done : open).push({ kind: 'memo', o: m });
    });
    Sched.eventsOn(current).forEach(function (e) {
      (e.done ? done : open).push({ kind: 'event', o: e });
    });

    var memos = open.filter(function (x) { return x.kind === 'memo'; });
    var evs   = open.filter(function (x) { return x.kind === 'event'; });

    var left = Sched.openCount(current);   // 提醒 + 日程里没做的
    var subs = [];
    if (isToday) subs.push('今天');
    if (left) subs.push('还有 ' + left + ' 件没做');
    else if (done.length) subs.push('已全部完成');
    else subs.push('暂无安排');
    subEl.textContent = subs.join(' · ');

    var html = '';

    html += section('提醒', memos.length,
      memos.map(function (x) { return Todo.rowHTML(memoItem(x.o)); }).join(''),
      '还没有提醒，在下面加一条');

    html += section('日程', evs.length,
      evs.map(function (x) { return Todo.rowHTML(evItem(x.o)); }).join(''),
      '这天没有日程');

    if (done.length) {
      html += '<details class="tp-done">' +
                '<summary>已完成 ' + done.length + ' 件</summary>' +
                '<div class="tp-list">' +
                  done.map(function (x) {
                    return Todo.rowHTML(x.kind === 'memo' ? memoItem(x.o) : evItem(x.o));
                  }).join('') +
                '</div>' +
              '</details>';
    }

    bodyEl.innerHTML = html;
    Todo.paint(bodyEl);
  }

  function section(title, n, rows, emptyHint) {
    return '<section class="tp-sec">' +
             '<h3 class="tp-h">' + title +
               (n ? ' <span class="tp-n">' + n + '</span>' : '') + '</h3>' +
             (rows
               ? '<div class="tp-list">' + rows + '</div>'
               : '<p class="tp-empty">' + emptyHint + '</p>') +
           '</section>';
  }

  function memoItem(m) {
    return { ref: 'memo:' + m.id, text: m.text, done: m.done };
  }

  function evItem(e) {
    return {
      ref: 'event:' + e.id,
      text: e.title,
      sub: e.start + '–' + e.end + (e.note ? ' · ' + e.note : ''),
      done: e.done,
      color: e.color
    };
  }

  function applyVisible() {
    var on = Sched.ui.showTasks !== false && !tucked;
    panel.hidden = !on;
    var btn = document.getElementById('btn-tasks');
    if (btn) {
      btn.setAttribute('aria-pressed', String(on));
      btn.title = on ? '收起任务栏' : '展开任务栏 (M)';
    }
  }

  /* ── 添加提醒 ── */

  function addMemo() {
    var v = inputEl.value.trim();
    if (!v) return;
    if (!current) current = Sched.ymd(new Date());
    Sched.addMemo({ date: current, text: v });
    inputEl.value = '';
    App.toast('已添加提醒');
  }

  /** 快捷键 M：展开任务栏并把光标放进输入框 */
  function focusInput() {
    if (Sched.ui.showTasks === false || tucked) {
      Sched.ui.showTasks = true;
      tucked = false;
      Sched.saveUi();
      render();
    }
    inputEl.focus();
  }

  return {
    init: init, render: render, show: show,
    toggle: toggle, focusInput: focusInput
  };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   courses.js — 课程表：网格批量编辑 + 学期设置 + 生成到日历
   ══════════════════════════════════════════════════════════ */

var Courses = (function () {
  'use strict';

  var dlg, gridEl, bulkEl, selCountEl, pickEl, listEl, noteEl;
  var editingId = null;
  var editColor = 'blue';

  // 框选状态
  var sel = null;         // { wd1, wd2, p1, p2 }  0-based
  var dragging = false;

  function init() {
    dlg         = document.getElementById('dlg-courses');
    gridEl      = document.getElementById('ct-grid');
    bulkEl      = document.getElementById('ct-bulk');
    selCountEl  = document.getElementById('ct-selcount');
    pickEl      = document.getElementById('ct-pick');
    listEl      = document.getElementById('course-list');
    noteEl      = document.getElementById('gen-note');

    document.getElementById('btn-courses').addEventListener('click', open);
    document.getElementById('ct-close').addEventListener('click', function () { dlg.close(); });

    document.getElementById('term-start').addEventListener('change', function (ev) {
      var v = ev.target.value;
      if (v) {
        // 吸附到那一周的周一
        v = Sched.ymd(Sched.mondayOf(Sched.parseYmd(v)));
        ev.target.value = v;
      }
      Sched.settings.termStart = v;
      Sched.commit();
      render();
    });

    document.getElementById('ct-new').addEventListener('click', function () { editCourse(null); });

    document.getElementById('ct-apply').addEventListener('click', function () {
      if (!sel) return;
      var cid = pickEl.value;
      if (!cid) { App.toast('先新建一门课程'); return; }
      Sched.setSlotsFor(cid, cellsOfSel());
      clearSel();
      render();
      App.toast('已填入');
    });

    document.getElementById('ct-clear').addEventListener('click', function () {
      if (!sel) return;
      Sched.clearCells(cellsOfSel());
      clearSel();
      render();
    });

    document.getElementById('ct-cancel-sel').addEventListener('click', function () {
      clearSel(); render();
    });

    document.getElementById('ct-generate').addEventListener('click', function () {
      if (!Sched.settings.termStart) { App.toast('请先填「第 1 周周一」'); return; }
      if (!Sched.state.courses.length) { App.toast('课程列表还是空的'); return; }
      var n = Sched.regenerateCourses();
      App.toast('已生成 ' + n + ' 条课程日程');
      render();
      Month.render();
      if (Day.isOpen()) Day.render();
    });

    document.getElementById('ct-wipe').addEventListener('click', function () {
      var n = Sched.clearCourseEvents();
      App.toast(n ? '已清除 ' + n + ' 条课程日程' : '没有课程日程');
      Month.render();
      if (Day.isOpen()) Day.render();
      render();
    });

    document.getElementById('periods-reset').addEventListener('click', function () {
      Sched.state.periods = Sched.DEFAULT_PERIODS.map(function (p) {
        return { start: p.start, end: p.end };
      });
      Sched.commit();
      render();
    });

    /* 框选 */
    gridEl.addEventListener('mousedown', function (ev) {
      var cell = ev.target.closest('.ct-cell');
      if (!cell || ev.button !== 0) return;
      ev.preventDefault();
      if (ev.target.closest('.ct-slot') && !ev.shiftKey) {
        // 直接点已有课块 = 编辑那门课
        var sid = ev.target.closest('.ct-slot').dataset.course;
        if (sid) { editCourse(sid); return; }
      }
      dragging = true;
      var c = cellCoords(cell);
      sel = { wd1: c.wd, wd2: c.wd, p1: c.p, p2: c.p };
      paintSel();
    });

    gridEl.addEventListener('mousemove', function (ev) {
      if (!dragging || !sel) return;
      var cell = ev.target.closest('.ct-cell');
      if (!cell) return;
      var c = cellCoords(cell);
      sel.wd2 = c.wd;
      sel.p2 = c.p;
      paintSel();
    });

    document.addEventListener('mouseup', function () {
      if (!dragging) return;
      dragging = false;
      if (sel) {
        var n = (Math.abs(sel.wd2 - sel.wd1) + 1) * (Math.abs(sel.p2 - sel.p1) + 1);
        bulkEl.hidden = false;
        selCountEl.textContent = n;
      }
    });

    /* 课程属性弹窗 */
    document.getElementById('form-course').addEventListener('submit', function (ev) {
      ev.preventDefault();
      saveCourse();
    });
    document.getElementById('co-cancel').addEventListener('click', function () {
      document.getElementById('dlg-course').close();
    });
    document.getElementById('co-delete').addEventListener('click', function () {
      if (!editingId) return;
      var c = Sched.getCourse(editingId);
      if (!c) return;
      if (!confirm('删除课程「' + c.name + '」？对应的课程日程也会一起删掉。')) return;
      Sched.removeCourse(editingId);
      document.getElementById('dlg-course').close();
      render();
      Month.render();
      if (Day.isOpen()) Day.render();
    });

    buildSwatches(document.getElementById('co-colors'), function (id) { editColor = id; });
    bindPeriods();

    gridEl.style.gridTemplateColumns = '76px repeat(7, minmax(72px, 1fr))';
  }

  /* ── 打开 / 渲染 ── */

  function open() {
    document.getElementById('term-start').value = Sched.settings.termStart || '';
    render();
    dlg.showModal();
  }

  function render() {
    renderTermExcl();
    renderGrid();
    renderList();
    renderPick();
    renderPeriods();
    renderNote();
  }

  function renderTermExcl() {
    var wrap = document.getElementById('excl-wrap');
    var html = Sched.settings.excludeDates.map(function (d) {
      return '<span class="excl-chip">' + Sched.esc(d) +
             '<button data-del-excl="' + Sched.esc(d) + '" title="移除">✕</button></span>';
    }).join('');
    wrap.innerHTML = html + '<input type="date" id="add-excl" title="添加要跳过的日期">';
    wrap.querySelectorAll('[data-del-excl]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = b.dataset.delExcl;
        Sched.settings.excludeDates = Sched.settings.excludeDates.filter(function (x) {
          return x !== d;
        });
        Sched.commit();
        render();
      });
    });
    var inp = document.getElementById('add-excl');
    inp.addEventListener('change', function () {
      var v = inp.value;
      if (!v) return;
      if (Sched.settings.excludeDates.indexOf(v) === -1) {
        Sched.settings.excludeDates.push(v);
        Sched.settings.excludeDates.sort();
        Sched.commit();
      }
      render();
    });
  }

  /**
   * 装 (weekday, 第p节) 的课程，按「课名 + 节次范围」归并。
   *
   * 同一门课常因老师/地点/周次不同而拆成多条（比如习概论每周换老师，
   * 一周一条）。不归并的话这些同名的会并排挤成一堆看不清的竖条。
   * 名字不同但共占同一时段的（英语口语 / 英语阅读）仍然分开显示。
   */
  function slotGroups(wd, p) {
    var map = {}, order = [];
    Sched.state.courses.forEach(function (c) {
      c.slots.forEach(function (s) {
        if (s.weekday !== wd || p < s.from || p > s.to) return;
        var key = c.name + '␀' + s.from + '␀' + s.to;
        if (!map[key]) {
          map[key] = { name: c.name, from: s.from, to: s.to, items: [] };
          order.push(key);
        }
        map[key].items.push(c);
      });
    });
    return order.map(function (k) { return map[k]; });
  }

  /** 鼠标悬停时列出这一格里所有条目（老师 / 地点 / 周次） */
  function groupTip(g) {
    var lines = [g.name + '（第 ' + g.from + '-' + g.to + ' 节）'];
    g.items.forEach(function (c) {
      lines.push('  ' + (c.teacher || '—') + ' · ' + (c.location || '—') +
                 ' · 第 ' + Sched.formatWeeks(Sched.activeWeeks(c)) + ' 周');
    });
    return lines.join('\n');
  }

  function renderGrid() {
    var P = Sched.state.periods.length;
    var html = '<div class="hd corner">节次<br>时间</div>';

    for (var w = 0; w < 7; w++) {
      html += '<div class="hd">周' + Sched.WEEKDAY_CN[w] + '</div>';
    }

    for (var p = 1; p <= P; p++) {
      var per = Sched.state.periods[p - 1];
      html += '<div class="rowlab"><b>' + p + '</b>' +
              '<span>' + Sched.esc(per.start) + '</span>' +
              '<span>' + Sched.esc(per.end) + '</span></div>';

      for (var wd = 1; wd <= 7; wd++) {
        var inner = slotGroups(wd, p).map(function (g) {
          var top = (p === g.from) ? '' : ' cont-top';
          var bot = (p === g.to) ? '' : ' cont-bot';

          // 地点：全部一致才显示，否则笼统写「多个地点」
          var locs = {};
          g.items.forEach(function (c) { if (c.location) locs[c.location] = 1; });
          var names = Object.keys(locs);
          var meta = names.length === 1 ? names[0] : (names.length ? '多个地点' : '');

          return '<div class="ct-slot' + top + bot + '"' +
                 ' data-course="' + g.items[0].id + '"' +
                 ' data-color="' + Sched.esc(g.items[0].color) + '"' +
                 ' title="' + Sched.esc(groupTip(g)) + '">' +
                 '<span class="nm">' + Sched.esc(g.name) + '</span>' +
                 (p === g.from && meta
                   ? '<span class="lc">' + Sched.esc(meta) + '</span>' : '') +
                 '</div>';
        }).join('');

        html += '<div class="ct-cell' + (wd === 7 ? ' last' : '') + '"' +
                ' data-wd="' + wd + '" data-p="' + p + '">' + inner + '</div>';
      }
    }

    gridEl.innerHTML = html;

    // 上色
    var nodes = gridEl.querySelectorAll('.ct-slot');
    for (var i = 0; i < nodes.length; i++) {
      Sched.applyColors(nodes[i], nodes[i].dataset.color);
    }
  }

  function renderPick() {
    var opts = '<option value="">— 选择课程 —</option>';
    Sched.state.courses.forEach(function (c) {
      opts += '<option value="' + c.id + '">' + Sched.esc(c.name) + '</option>';
    });
    pickEl.innerHTML = opts;
  }

  function renderList() {
    var cs = Sched.state.courses;
    if (!cs.length) {
      listEl.innerHTML = '<div class="empty-note">还没有课程。点右上角「+ 新建课程」，' +
                         '然后框选格子批量填入。</div>';
      return;
    }
    listEl.innerHTML = cs.map(function (c) {
      var slots = c.slots.slice().sort(function (a, b) {
        return a.weekday - b.weekday || a.from - b.from;
      }).map(function (s) {
        return '周' + Sched.WEEKDAY_CN[s.weekday - 1] + ' ' + s.from + '-' + s.to + '节';
      }).join('，') || '（未安排时间）';

      var weeks = (c.weeks && c.weeks.length)
        ? '第 ' + Sched.formatWeeks(Sched.activeWeeks(c)) + ' 周'
        : '第' + c.fromWeek + '-' + c.toWeek + '周' +
          (c.parity === 'odd' ? ' 单周' : c.parity === 'even' ? ' 双周' : '');

      return '<div class="course-row" data-id="' + c.id + '">' +
               '<span class="dot" data-color="' + Sched.esc(c.color) + '"></span>' +
               '<span><span class="cn">' + Sched.esc(c.name) + '</span> ' +
                 '<span class="meta">' + Sched.esc([c.teacher, c.location].filter(Boolean).join(' · ')) + '</span>' +
               '</span>' +
               '<span class="slots">' + Sched.esc(slots) + '<br>' +
                 '<span class="meta">' + weeks + '</span></span>' +
               '<span class="cnt">' + Sched.countCourse(c) + ' 节</span>' +
             '</div>';
    }).join('');

    listEl.querySelectorAll('.course-row').forEach(function (row) {
      Sched.applyColors(row.querySelector('.dot'), row.querySelector('.dot').dataset.color);
      row.addEventListener('click', function () { editCourse(row.dataset.id); });
    });
  }

  /* 节次表是每次 render 重建的，所以监听器只在 init 里用事件委托挂一次，
     否则每渲染一轮就多叠一个，改一次时间会被处理 N 遍。 */
  function bindPeriods() {
    document.getElementById('periods-grid').addEventListener('change', function (ev) {
      var inp = ev.target.closest('input[data-pi]');
      if (!inp) return;
      var i = +inp.dataset.pi;
      Sched.state.periods[i][inp.dataset.k] = inp.value;
      Sched.commit();
      renderGrid();
      renderNote();
    });
  }

  function renderPeriods() {
    document.getElementById('periods-grid').innerHTML =
      Sched.state.periods.map(function (p, i) {
        return '<label><b>' + (i + 1) + '</b>' +
               '<input type="time" data-pi="' + i + '" data-k="start" value="' + Sched.esc(p.start) + '">' +
               '<input type="time" data-pi="' + i + '" data-k="end" value="' + Sched.esc(p.end) + '">' +
               '</label>';
      }).join('');
  }

  function renderNote() {
    if (!Sched.settings.termStart) {
      noteEl.textContent = '先填「第 1 周周一」才能生成';
      return;
    }
    var n = 0;
    Sched.state.courses.forEach(function (c) { n += Sched.countCourse(c); });
    noteEl.textContent = '按当前设置会生成 ' + n + ' 条课程日程';
  }

  /* ── 框选辅助 ── */

  function cellCoords(cell) {
    return { wd: +cell.dataset.wd, p: +cell.dataset.p };
  }

  function selRect() {
    if (!sel) return null;
    return {
      wd1: Math.min(sel.wd1, sel.wd2), wd2: Math.max(sel.wd1, sel.wd2),
      p1:  Math.min(sel.p1, sel.p2),   p2:  Math.max(sel.p1, sel.p2)
    };
  }

  /** 选区 → 槽位数组：每一列生成一个跨行区间的槽 */
  function cellsOfSel() {
    var r = selRect();
    if (!r) return [];
    var out = [];
    for (var wd = r.wd1; wd <= r.wd2; wd++) {
      out.push({ weekday: wd, from: r.p1, to: r.p2 });
    }
    return out;
  }

  function paintSel() {
    var r = selRect();
    gridEl.querySelectorAll('.ct-cell').forEach(function (cell) {
      var c = cellCoords(cell);
      var inSel = c.wd >= r.wd1 && c.wd <= r.wd2 && c.p >= r.p1 && c.p <= r.p2;
      cell.classList.toggle('in-sel', inSel);
    });
    var n = (r.wd2 - r.wd1 + 1) * (r.p2 - r.p1 + 1);
    bulkEl.hidden = false;
    selCountEl.textContent = n;
  }

  function clearSel() {
    sel = null;
    bulkEl.hidden = true;
    gridEl.querySelectorAll('.ct-cell.in-sel').forEach(function (c) {
      c.classList.remove('in-sel');
    });
  }

  /* ── 课程属性弹窗 ── */

  function editCourse(id) {
    editingId = id;
    var c = id ? Sched.getCourse(id) : null;
    var dlgC = document.getElementById('dlg-course');

    document.getElementById('co-title-h').textContent = c ? '编辑课程' : '新建课程';
    document.getElementById('co-delete').hidden = !c;

    document.getElementById('co-name').value      = c ? c.name : '';
    document.getElementById('co-teacher').value   = c ? c.teacher : '';
    document.getElementById('co-location').value  = c ? c.location : '';
    document.getElementById('co-from').value      = c ? c.fromWeek : 1;
    document.getElementById('co-to').value        = c ? c.toWeek : 16;
    document.getElementById('co-parity').value    = c ? c.parity : 'all';
    document.getElementById('co-weeks').value     = c ? Sched.formatWeeks(c.weeks) : '';
    document.getElementById('co-excl').value      = c ? (c.excludeDates || []).join(', ') : '';

    editColor = c ? c.color : nextColor();
    paintSwatches(document.getElementById('co-colors'), editColor);

    dlgC.showModal();
    setTimeout(function () { document.getElementById('co-name').focus(); }, 30);
  }

  function nextColor() {
    return Sched.PALETTE[Sched.state.courses.length % Sched.PALETTE.length].id;
  }

  function saveCourse() {
    var name = document.getElementById('co-name').value.trim();
    if (!name) return;

    var excl = document.getElementById('co-excl').value
      .split(/[,，\s]+/).map(function (s) { return s.trim(); })
      .filter(function (s) { return /^\d{4}-\d{2}-\d{2}$/.test(s); });

    var data = {
      name: name,
      teacher: document.getElementById('co-teacher').value.trim(),
      location: document.getElementById('co-location').value.trim(),
      fromWeek: +document.getElementById('co-from').value || 1,
      toWeek: +document.getElementById('co-to').value || 16,
      parity: document.getElementById('co-parity').value,
      weeks: Sched.parseWeeks(document.getElementById('co-weeks').value),
      excludeDates: excl,
      color: editColor
    };

    if (editingId) {
      Sched.updateCourse(editingId, data);
    } else {
      data.slots = [];
      Sched.addCourse(data);
    }

    document.getElementById('dlg-course').close();
    render();
  }

  /* ── 颜色选择器 ── */

  function buildSwatches(wrap, onPick) {
    wrap.innerHTML = Sched.PALETTE.map(function (p) {
      return '<button type="button" class="sw" data-color="' + p.id + '"' +
             ' title="' + p.name + '" aria-pressed="false"></button>';
    }).join('');

    wrap.querySelectorAll('.sw').forEach(function (b) {
      b.style.background = Sched.colorHex(b.dataset.color);
      b.addEventListener('click', function () {
        onPick(b.dataset.color);
        paintSwatches(wrap, b.dataset.color);
      });
    });
  }

  function paintSwatches(wrap, colorId) {
    wrap.querySelectorAll('.sw').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.color === colorId));
    });
  }

  return { init: init, open: open, render: render, editCourse: editCourse };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   syncui.js — 云同步的界面：设置弹窗、状态显示、冲突选择

   逻辑都在 sync.js 里，这里只负责把它的话翻译成人看的。
   ══════════════════════════════════════════════════════════ */

var SyncUI = (function () {
  'use strict';

  var dlg, repoEl, tokenEl, stateEl, errEl, conflictEl, backupEl;
  var localFactsEl, cloudFactsEl;

  function $(id) { return document.getElementById(id); }

  function init() {
    dlg          = $('dlg-sync');
    repoEl       = $('sy-repo');
    tokenEl      = $('sy-token');
    stateEl      = $('sy-state');
    errEl        = $('sy-err');
    conflictEl   = $('sy-conflict');
    backupEl     = $('sy-backup');
    localFactsEl = $('sy-cf-local');
    cloudFactsEl = $('sy-cf-cloud');

    $('bd-sy-close').addEventListener('click', function () { dlg.close(); });

    $('bd-sy-save').addEventListener('click', function () {
      var parts = splitRepo(repoEl.value);
      if (!parts) { App.toast('仓库要写成 用户名/仓库名 的形式'); return; }
      var token = tokenEl.value.trim();
      var cfg = Sync.config;
      if (!token && !(cfg && cfg.token)) { App.toast('还要填 Token'); return; }
      var patch = { owner: parts[0], repo: parts[1] };
      if (token) patch.token = token;      // 留空表示不改原来那个
      Sync.configure(patch);
      tokenEl.value = '';
      App.toast('已保存，开始同步');
      Sync.start();
      Sync.pull();
      paint();
    });

    $('bd-sy-test').addEventListener('click', function () {
      var parts = splitRepo(repoEl.value);
      var token = tokenEl.value.trim() || (Sync.config && Sync.config.token);
      if (!parts || !token) { App.toast('先填仓库和 Token'); return; }
      // 用当前填的这组凭据临时试一下，不写进配置
      var keep = Sync.config;
      Sync.configure({ owner: parts[0], repo: parts[1], token: token });
      stateEl.textContent = '正在测试…';
      errEl.hidden = true;
      Sync.probeRepo().then(function () {
        var f = '连接正常' + (Sync.status.state === 'off' ? '' : '');
        errEl.hidden = false;
        errEl.className = 'sy-line ok';
        errEl.textContent = f;
      }).catch(function (e) {
        errEl.hidden = false;
        errEl.className = 'sy-line bad';
        errEl.textContent = e.message || String(e);
      });
    });

    $('bd-sy-now').addEventListener('click', function () {
      var dirty = Sched.state.lastSeq !== (Sync.config && Sync.config.syncedSeq);
      if (!Sync.isConfigured()) { App.toast('先填好仓库和 Token'); return; }
      stateEl.textContent = '同步中…';
      // 空数据要不要推，交给用户点头——这一步会清掉云端的
      var empty = countItems(Sched.state) === 0;
      if (empty && !dirty) { Sync.syncNow(); return; }
      if (empty && !confirm('本机的日程、提醒、课程都是空的。\n继续会把云端那份也清空。确定吗？')) return;
      Sync.syncNow();
    });

    $('bd-sy-off').addEventListener('click', function () {
      if (!confirm('断开同步？本机数据会保留，云端那份也会留着，只是不再互相同步。')) return;
      Sync.disconnect();
      repoEl.value = '';
      tokenEl.value = '';
      paint();
    });

    $('bd-cf-cloud').addEventListener('click', function () { resolve('cloud'); });
    $('bd-cf-local').addEventListener('click', function () { resolve('local'); });
    $('bd-cf-both').addEventListener('click', function () { resolve('both'); });

    $('bd-sy-download').addEventListener('click', function () {
      var b = Sync.lastBackup();
      if (!b) return;
      download('schedule-backup-' + new Date(b.data.at).toISOString().slice(0, 10) + '.json',
               JSON.stringify(b.data.state, null, 2));
    });

    Sync.onStatus(function () { paint(); });
  }

  function resolve(choice) {
    Sync.resolveConflict(choice).then(function (r) {
      if (r === 'error') return;
      App.toast(choice === 'both' ? '已用云端的，本地那份进了备份'
               : choice === 'cloud' ? '已用云端的' : '已用本地的');
      paint();
    });
  }

  function open() {
    if (Sync.isConfigured()) {
      repoEl.value = Sync.config.owner + '/' + Sync.config.repo;
      $('sy-path').value = Sync.FILE;
    }
    paint();
    dlg.showModal();
  }

  /* ── 渲染 ── */

  function paint() {
    var st = Sync.status;
    var cfg = Sync.config;

    // ⋯ 菜单上的那一行 + 小圆点
    var label = $('sy-menu-label');
    var dot = $('sync-dot');
    if (label) label.textContent = menuLabel(st);
    if (dot) {
      dot.hidden = (st.state === 'off' || st.state === 'idle');
      dot.className = 'sync-dot' +
        (st.state === 'conflict' ? ' warn' : st.state === 'syncing' ? ' busy' : ' bad');
    }

    if (!dlg) return;

    stateEl.className = 'sy-line';
    if (st.state === 'off') {
      stateEl.textContent = '未开启。数据只存在这台设备上。';
    } else if (st.state === 'syncing') {
      stateEl.textContent = st.message || '同步中…';
    } else if (st.state === 'idle') {
      // 只有一切正常时才报「上次同步」——出错或冲突的时候，
      // 那是干扰信息，用户要看的是下面那段
      var when = cfg && cfg.lastSyncAt ? '，上次同步 ' + ago(cfg.lastSyncAt) : '';
      stateEl.textContent = (st.message || '已连接') + when;
    } else {
      stateEl.textContent = st.message || '已连接';
    }

    var err = cfg && cfg.lastError;
    errEl.hidden = !err;
    if (err) {
      errEl.className = 'sy-line bad';
      errEl.textContent = err;
    }

    // 冲突
    var cf = Sync.conflict;
    conflictEl.hidden = !cf;
    if (cf) {
      localFactsEl.textContent = facts(Sched.state);
      cloudFactsEl.textContent = facts(cf.cloud.state);
    }

    // 备份
    var b = Sync.lastBackup();
    backupEl.hidden = !b;
    if (b) {
      $('sy-bak-info').textContent = ago(b.data.at) + '（' + b.data.reason + '）';
    }

    $('bd-sy-off').hidden = !cfg;
    $('bd-sy-now').hidden = !cfg;
    $('bd-sy-test').hidden = !cfg;
  }

  function menuLabel(st) {
    if (st.state === 'off') return '云同步 · 未开启';
    if (st.state === 'syncing') return '云同步 · 同步中…';
    if (st.state === 'conflict') return '云同步 · 有冲突，需要处理';
    if (st.state === 'error') return '云同步 · 出错了';
    if (st.state === 'blocked') return '云同步 · 已暂停';
    return '云同步 · ' + (st.message || '已连接');
  }

  /** 冲突弹窗里那一行事实。哪一边由前面的标签负责，这里只报数字，
      不然会写成「本机 · 本机 · 刚刚 · …」。 */
  function facts(s) {
    var when = s.savedAt ? ago(s.savedAt) : '时间未知';
    var n = countItems(s);
    var ev = (s.events || []).length, me = (s.memos || []).length, co = (s.courses || []).length;
    return when + ' · 共 ' + n + ' 项' +
           '（日程 ' + ev + ' / 提醒 ' + me + ' / 课程 ' + co + '）';
  }

  function countItems(s) {
    return (s.events || []).length + (s.memos || []).length + (s.courses || []).length;
  }

  function ago(ts) {
    var d = Date.now() - ts;
    if (d < 0) d = 0;
    var m = Math.floor(d / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }

  function splitRepo(v) {
    var m = /^\s*([^\/\s]+)\s*\/\s*([^\/\s]+)\s*$/.exec(v || '');
    return m ? [m[1], m[2]] : null;
  }

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  return { init: init, open: open, paint: paint, countItems: countItems };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   app.js — 装配：工具栏、日程弹窗、导入导出、快捷键
   ══════════════════════════════════════════════════════════ */

var App = (function () {
  'use strict';

  var dlgEv, editingId = null, evColor = 'blue';
  var toastEl, toastTimer = null;

  /* ── 启动 ────────────────────────────────────────────────── */

  function boot() {
    Sched.load();

    // 数据一变就重画。放在这里而不是各处手动调用，是为了保证
    // 任何改动路径（格子里的快速输入、拖拽改期、导入、课表生成…）
    // 都不会漏掉刷新。
    Sched.onChange(refresh);

    initSync();
    initStorageWatch();

    Month.init({ onSelect: onSelectDay });
    Month.bind();
    Month.render();
    Day.init();
    Tasks.init();
    Courses.init();

    initEventDialog();
    initToolbar();
    initShortcuts();
    initThemeWatch();

    document.addEventListener('sched:edit-event', function (e) { openEvent(e.detail); });
    document.addEventListener('sched:new-event', function (e) {
      openEvent(null, e.detail);
    });

    // 打开时默认展开今天
    onSelectDay(Sched.ymd(new Date()));
  }

  function onSelectDay(dateStr) {
    Day.open(dateStr);
    Tasks.show(dateStr);
  }

  /* ── 云同步 ──────────────────────────────────────────────── */

  function initSync() {
    Sync.init({
      // 编辑弹窗开着的时候别用云端内容盖掉本地：弹窗里还攥着
      // editingId 和一堆旧字段值，盖掉之后用户一保存就把旧值写回去了。
      // 云同步自己的弹窗不算——用户正在里面点「保存并同步」呢，
      // 一挡就变成「点了没反应」。
      canAdopt: function () {
        var open = document.querySelector('dialog[open]');
        return !open || open.id === 'dlg-sync';
      }
    });
    SyncUI.init();
    if (Sync.isConfigured()) {
      Sync.start();
      Sync.pull();
    }
  }

  /**
   * 同一个浏览器开两个标签页时，另一页写的数据这里收得到。
   * 不管的话，两个标签页各凭内存里那份旧的 state 覆盖 localStorage，
   * 后写的把先写的整份抹掉——这个问题在加同步之前就存在了，
   * 而加了同步会被原样搬到云端。
   */
  function initStorageWatch() {
    window.addEventListener('storage', function (ev) {
      if (ev.key !== Sched.KEY) return;
      var dirty = Sched.state.lastSeq !== (Sync.config && Sync.config.syncedSeq);
      if (dirty) {
        toast('另一个标签页改了数据，本页也有没同步的改动，建议刷新');
        return;
      }
      Sched.load();                 // 重新读一遍 localStorage
      if (Sync.config) Sync.config.syncedSeq = Sched.state.lastSeq;
      refresh();
    });
  }

  /* ── 日程编辑弹窗 ────────────────────────────────────────── */

  function initEventDialog() {
    dlgEv = document.getElementById('dlg-event');
    buildSwatches();

    document.getElementById('ev-cancel').addEventListener('click', function () { dlgEv.close(); });

    document.getElementById('ev-delete').addEventListener('click', function () {
      if (!editingId) return;
      var e = Sched.getEvent(editingId);
      if (!e) return;
      if (!confirm('删除「' + e.title + '」？')) return;
      Sched.removeEvent(editingId);
      dlgEv.close();
      refresh();
    });

    document.getElementById('form-event').addEventListener('submit', function (ev) {
      ev.preventDefault();
      saveEvent();
    });

    // 改开始时间时，结束时间不早于开始
    document.getElementById('ev-start').addEventListener('change', function () {
      var s = document.getElementById('ev-start').value;
      var e = document.getElementById('ev-end').value;
      if (!e || Sched.toMin(e) <= Sched.toMin(s)) {
        document.getElementById('ev-end').value = Sched.minToTime(Sched.toMin(s) + 60);
      }
    });
  }

  /**
   * @param {string|null} id      要编辑的日程 id
   * @param {object}      preset  新建时的预填 { date, start, end }
   */
  function openEvent(id, preset) {
    editingId = id || null;
    var e = id ? Sched.getEvent(id) : null;

    document.getElementById('ev-title-h').textContent = e ? '编辑日程' : '新建日程';
    document.getElementById('ev-delete').hidden = !e;

    var date, start, end;
    if (e) {
      date = e.date; start = e.start; end = e.end;
      document.getElementById('ev-title').value = e.title;
      document.getElementById('ev-note').value = e.note || '';
      document.getElementById('ev-important').checked = !!e.important;
      document.getElementById('ev-done').checked = !!e.done;
      evColor = e.color;
    } else {
      var p = preset || {};
      date  = p.date || Month.getSelected() || Sched.ymd(new Date());
      start = p.start || '09:00';
      end   = p.end || Sched.minToTime(Sched.toMin(start) + 60);
      document.getElementById('ev-title').value = '';
      document.getElementById('ev-note').value = '';
      document.getElementById('ev-important').checked = false;
      document.getElementById('ev-done').checked = false;
      evColor = 'blue';
    }

    document.getElementById('ev-date').value  = date;
    document.getElementById('ev-start').value = start;
    document.getElementById('ev-end').value   = end;
    paintSwatches();

    dlgEv.showModal();
    setTimeout(function () { document.getElementById('ev-title').focus(); }, 30);
  }

  function saveEvent() {
    var title = document.getElementById('ev-title').value.trim();
    if (!title) return;

    var date  = document.getElementById('ev-date').value;
    var start = document.getElementById('ev-start').value;
    var end   = document.getElementById('ev-end').value;
    if (!date || !start) { toast('日期和开始时间是必填的'); return; }
    if (!end || Sched.toMin(end) <= Sched.toMin(start)) {
      end = Sched.minToTime(Sched.toMin(start) + 60);
    }

    var data = {
      date: date, start: start, end: end, title: title,
      note: document.getElementById('ev-note').value.trim(),
      color: evColor,
      important: document.getElementById('ev-important').checked,
      done: document.getElementById('ev-done').checked
    };

    if (editingId) Sched.updateEvent(editingId, data);
    else Sched.addEvent(data);

    dlgEv.close();
    Month.gotoDate(date);
    refresh();
    toast(editingId ? '已保存' : '已添加');
  }

  /* ── 颜色选择器 ──────────────────────────────────────────── */

  function buildSwatches() {
    var wrap = document.getElementById('ev-colors');
    wrap.innerHTML = Sched.PALETTE.map(function (p) {
      return '<button type="button" class="sw" data-color="' + p.id + '"' +
             ' title="' + p.name + '" aria-pressed="false"></button>';
    }).join('');

    wrap.querySelectorAll('.sw').forEach(function (b) {
      b.style.background = Sched.colorHex(b.dataset.color);
      b.addEventListener('click', function () {
        evColor = b.dataset.color;
        paintSwatches();
      });
    });
  }

  function paintSwatches() {
    document.querySelectorAll('#ev-colors .sw').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.color === evColor));
    });
  }

  /* ── 工具栏 ──────────────────────────────────────────────── */

  function initToolbar() {
    document.getElementById('btn-prev').addEventListener('click', function () { Month.shift(-1); });
    document.getElementById('btn-next').addEventListener('click', function () { Month.shift(1); });

    document.getElementById('btn-today').addEventListener('click', function () {
      Month.gotoToday();
      Day.open(Month.getSelected());
    });

    document.getElementById('btn-month').addEventListener('click', function () {
      jumpMonth();
    });

    // 界面偏好，不是数据：存本机、不 commit，免得触发一次云同步推送
    var chk = document.getElementById('chk-important');
    chk.checked = Sched.ui.onlyImportant;
    chk.addEventListener('change', function () {
      Sched.ui.onlyImportant = chk.checked;
      Sched.saveUi();
      Month.render();
    });

    document.getElementById('btn-tasks').addEventListener('click', function () {
      Tasks.toggle();
    });

    /* ⋯ 菜单 */
    var menu = document.getElementById('menu');
    document.getElementById('btn-menu').addEventListener('click', function (ev) {
      ev.stopPropagation();
      menu.hidden = !menu.hidden;
    });
    document.addEventListener('click', function () { menu.hidden = true; });

    menu.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-act]');
      if (!b) return;
      menu.hidden = true;
      doAction(b.dataset.act);
    });

    /* 导入 */
    var file = document.getElementById('file-import');
    document.getElementById('file-import').addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          // 导入会整份替换，把现在这份先存下来——导入的若是半年前的备份，
          // 不备份就再也找不回来了（而且它还会顺着同步推上云端）
          Sync.stash('导入之前', JSON.parse(Sched.serialize()));
          Sched.importJSON(String(reader.result));
          refresh();
          Courses.render();
          toast(Sync.isConfigured() ? '导入成功，稍后会同步到云端' : '导入成功');
        } catch (err) {
          toast('导入失败：文件格式不对');
          console.error(err);
        }
      };
      reader.readAsText(f);
      file.value = '';
    });
  }

  function doAction(act) {
    if (act === 'sync') {
      SyncUI.open();
    } else if (act === 'export') {
      var blob = new Blob([Sched.exportJSON()], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'schedule-' + Sched.ymd(new Date()) + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('已导出');
    } else if (act === 'import') {
      document.getElementById('file-import').click();
    } else if (act === 'demo') {
      loadDemo();
    } else if (act === 'clear') {
      var synced = Sync.isConfigured();
      var msg = '清空全部日程、提醒和课程？此操作不可撤销。';
      if (synced) msg += '\n\n云同步开着，云端那份也会一起清空。' +
                         '（云端是 git 仓库，历史记录里还能翻回上一版。）';
      if (!confirm(msg)) return;
      // 先留一份本机的，万一清错了还能捞回来
      Sync.stash('清空全部数据之前', JSON.parse(Sched.serialize()));
      Sched.replaceAll(Sched.defaultState());
      refresh();
      Courses.render();
      if (synced) Sync.push(true);      // 手动推，绕过「空数据不自动推」的保护
      else toast('已清空');
    }
  }

  /** 月份快速跳转 */
  function jumpMonth() {
    var cur = Month.getView();
    var s = prompt('跳到哪个月？（格式 2026-09）', cur.y + '-' + Sched.pad(cur.m + 1));
    if (!s) return;
    var m = /^(\d{4})\D+(\d{1,2})$/.exec(s.trim());
    if (!m) { toast('格式不对，示例：2026-09'); return; }
    Month.goto(+m[1], +m[2] - 1);
  }

  /* ── 示例数据 ────────────────────────────────────────────── */

  function loadDemo() {
    if (!confirm('载入一组示例课程？会覆盖当前的课程设置（日程保留）。')) return;

    var thisMonday = Sched.mondayOf(new Date());
    var demo = [
      { name: '高等数学',   teacher: '张老师', location: '教三-201', color: 'blue',
        fromWeek: 1, toWeek: 16, parity: 'all',
        slots: [{ weekday: 1, from: 1, to: 2 }, { weekday: 3, from: 3, to: 4 }] },
      { name: '线性代数',   teacher: '李老师', location: '主楼-315', color: 'violet',
        fromWeek: 1, toWeek: 16, parity: 'all',
        slots: [{ weekday: 2, from: 1, to: 2 }, { weekday: 4, from: 5, to: 6 }] },
      { name: '大学英语',   teacher: 'Smith',  location: '外语楼-108', color: 'green',
        fromWeek: 1, toWeek: 12, parity: 'odd',
        slots: [{ weekday: 3, from: 1, to: 2 }] },
      { name: '大学物理',   teacher: '王老师', location: '理科楼-402', color: 'orange',
        fromWeek: 1, toWeek: 16, parity: 'all',
        slots: [{ weekday: 5, from: 3, to: 4 }] },
      { name: '程序设计',   teacher: '陈老师', location: '机房-6', color: 'teal',
        fromWeek: 2, toWeek: 14, parity: 'all',
        slots: [{ weekday: 4, from: 9, to: 10 }, { weekday: 5, from: 9, to: 10 }] }
    ];

    Sched.state.courses = [];
    demo.forEach(function (d) { Sched.addCourse(d); });
    Sched.settings.termStart = Sched.ymd(thisMonday);
    Sched.settings.skipped = [];
    Sched.commit();

    var n = Sched.regenerateCourses();
    refresh();
    Courses.render();
    toast('已载入 ' + demo.length + ' 门示例课程，生成 ' + n + ' 条日程');
  }

  /* ── 快捷键 ──────────────────────────────────────────────── */

  /* 会吞掉按键的输入类控件。注意只列「真的在输入文字」的类型：
     复选框/单选框上按方向键本来就没事干，那种情况应该让快捷键照常生效。 */
  var TYPING_TYPES = {
    text: 1, search: 1, url: 1, tel: 1, email: 1, password: 1, number: 1,
    date: 1, time: 1, 'datetime-local': 1, month: 1, week: 1
  };

  function isTyping(el) {
    if (!el || !el.tagName) return false;
    if (el.isContentEditable) return true;
    if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
    if (el.tagName === 'INPUT') return !!TYPING_TYPES[(el.type || 'text').toLowerCase()];
    return false;
  }

  function initShortcuts() {
    document.addEventListener('keydown', function (ev) {
      if (isTyping(ev.target)) return;
      if (document.querySelector('dialog[open]')) return;

      if (ev.key === 'ArrowLeft')  { ev.preventDefault(); Month.shift(-1); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); Month.shift(1); }
      else if (ev.key === 't' || ev.key === 'T') {
        Month.gotoToday(); Day.open(Month.getSelected());
      }
      else if (ev.key === 'n' || ev.key === 'N') {
        var d = Month.getSelected() || Sched.ymd(new Date());
        document.dispatchEvent(new CustomEvent('sched:new-event', {
          detail: { date: d, start: '09:00', end: '10:00' }
        }));
      }
      else if (ev.key === 'm' || ev.key === 'M') { Tasks.focusInput(); }
      else if (ev.key === 'c' || ev.key === 'C') { Courses.open(); }
      else if (ev.key === 'Escape') { Day.close(); }
    });
  }

  function initThemeWatch() {
    if (typeof matchMedia === 'undefined') return;
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var fn = function () {
      Month.render();
      if (Day.isOpen()) Day.render();
      if (document.getElementById('dlg-courses').open) Courses.render();
    };
    if (mq.addEventListener) mq.addEventListener('change', fn);
    else if (mq.addListener) mq.addListener(fn);
  }

  /* ── 杂项 ────────────────────────────────────────────────── */

  function refresh() {
    Month.render();
    if (Day.isOpen()) Day.render();
    Tasks.render();
    if (document.getElementById('dlg-courses').open) Courses.render();
  }

  function toast(msg) {
    toastEl = toastEl || document.getElementById('toast');
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  return { toast: toast, refresh: refresh, openEvent: openEvent };
})();

</script>
