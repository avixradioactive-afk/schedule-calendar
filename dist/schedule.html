<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日程 · 日历</title>
<!-- 由 tools/build.js 自动生成，请勿直接修改；改动请改源码后重新 npm run build -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><rect x='20' y='26' width='60' height='54' rx='8' fill='white'/><rect x='20' y='26' width='60' height='14' rx='7' fill='%23bfdbfe'/><rect x='32' y='12' width='7' height='20' rx='3.5' fill='white'/><rect x='61' y='12' width='7' height='20' rx='3.5' fill='white'/><rect x='30' y='50' width='14' height='10' rx='3' fill='%232563eb'/><rect x='50' y='50' width='14' height='10' rx='3' fill='%2393c5fd'/><rect x='30' y='65' width='14' height='10' rx='3' fill='%2393c5fd'/></svg>">
<style>
/* ══════════════════════════════════════════════════════════
   日程 · 日历   样式表
   ══════════════════════════════════════════════════════════ */

:root {
  --bg:        #f4f5f7;
  --surface:   #ffffff;
  --surface-2: #fafbfc;
  --border:    #e3e6ea;
  --border-2:  #eef0f3;
  --text:      #1b1f24;
  --text-2:    #5b6470;
  --text-3:    #98a1ad;
  --accent:    #2563eb;
  --accent-bg: #e8effd;
  --danger:    #dc2626;
  --today-bg:  #eef4ff;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-md: 0 4px 12px rgba(16,24,40,.10), 0 2px 4px rgba(16,24,40,.06);
  --shadow-lg: 0 16px 48px rgba(16,24,40,.18), 0 4px 12px rgba(16,24,40,.08);
  --r:  10px;
  --r-lg: 16px;
  --hour-h: 58px;
  --dp-w: 400px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0f1115;
    --surface:   #171a1f;
    --surface-2: #1c2027;
    --border:    #2a2f38;
    --border-2:  #23272f;
    --text:      #e8eaed;
    --text-2:    #9aa3af;
    --text-3:    #6b7480;
    --accent:    #60a5fa;
    --accent-bg: #1b2740;
    --danger:    #f87171;
    --today-bg:  #182238;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.6);
  }
}

* { box-sizing: border-box; }

/* 这些元素在别处显式写了 display，会盖掉浏览器对 [hidden] 的默认处理，
   所以统一补一条。 */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ── 顶栏 ────────────────────────────────────────────────── */

.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 9px; }

.brand h1 {
  font-size: 15px;
  font-weight: 650;
  margin: 0;
  letter-spacing: .01em;
}

.logo {
  width: 18px; height: 18px;
  border-radius: 5px;
  background: var(--accent);
  box-shadow: inset 0 -6px 0 rgba(255,255,255,.45);
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-right: auto;
}

.month-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 170px;
}

#btn-month {
  background: none;
  border: 0;
  padding: 2px 4px;
  border-radius: 6px;
  font: inherit;
  font-size: 16px;
  font-weight: 650;
  color: var(--text);
  cursor: pointer;
}

#btn-month:hover { background: var(--surface-2); }

.week-badge {
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
}

.week-badge:empty { display: none; }

.topbar-actions { display: flex; align-items: center; gap: 10px; }

/* ── 通用控件 ────────────────────────────────────────────── */

.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}

.btn:hover  { background: var(--surface-2); border-color: var(--text-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--border); }
.btn.danger { color: var(--danger); }
.btn.danger.ghost:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.btn.sm { padding: 4px 9px; font-size: 12px; }

.icon-btn {
  font: inherit;
  font-size: 17px;
  line-height: 1;
  width: 30px; height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
}

.icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}

.switch input { accent-color: var(--accent); margin: 0; cursor: pointer; }
.switch.big { gap: 9px; padding: 9px 11px; border: 1px solid var(--border);
              border-radius: var(--r); background: var(--surface-2); align-items: flex-start; }
.switch.big span { font-size: 13px; line-height: 1.45; }
.switch.big b { color: var(--text); }

/* 下拉菜单 */
.menu-wrap { position: relative; }

.menu {
  position: absolute;
  right: 0; top: calc(100% + 6px);
  min-width: 190px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  padding: 5px;
  z-index: 60;
}

.menu button {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--text);
  cursor: pointer;
}

.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--border-2); margin: 5px 2px; }

/* ── 主体布局 ────────────────────────────────────────────── */

.layout {
  flex: 1;
  display: flex;
  min-height: 0;
}

.month {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 10px 12px 12px;
  gap: 6px;
}

.weekdays {
  flex: none;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.weekdays span {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: .06em;
  padding-bottom: 2px;
}

.weekdays span.we { color: color-mix(in srgb, var(--accent) 70%, var(--text-3)); }

.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  min-height: 0;
}

/* ── 月历格子 ────────────────────────────────────────────── */

.cell {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  padding: 4px 5px 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color .12s, box-shadow .12s;
}

.cell:hover { border-color: var(--text-3); box-shadow: var(--shadow-sm); }

.cell.other { background: var(--surface-2); opacity: .55; }
.cell.other .dnum { color: var(--text-3); }

.cell.today {
  background: var(--today-bg);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset;
}

.cell.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
}

.cell-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 3px;
  min-height: 20px;
}

.dnum {
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 20px;
  min-width: 20px;
  text-align: center;
  border-radius: 6px;
  padding: 0 3px;
}

.cell.today .dnum { background: var(--accent); color: #fff; }

.cell-head .spacer { flex: 1; }

.add-btn {
  flex: none;
  width: 20px; height: 20px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 15px; line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s, background .12s;
}

.cell:hover .add-btn { opacity: 1; }
.add-btn:hover { background: var(--accent); color: #fff; }

.cell-events {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-height: 0;
  overflow: hidden;
}

/* 事件小条 */
.chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 1px 5px;
  border-radius: 5px;
  border-left: 3px solid var(--c);
  background: var(--c-bg);
  color: var(--c);
  font-size: 11.5px;
  line-height: 16px;
  height: 18px;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  flex: none;
}

.chip:hover { filter: brightness(.94); }
.chip .t { font-variant-numeric: tabular-nums; opacity: .78; flex: none; }
.chip .n { overflow: hidden; text-overflow: ellipsis; }

.chip.important { font-weight: 650; }
.chip.important .n::before { content: "★ "; font-size: 9px; }

.chip.done { opacity: .5; }
.chip.done .n { text-decoration: line-through; }

.more {
  flex: none;
  font-size: 11px;
  color: var(--text-3);
  padding-left: 6px;
  cursor: pointer;
}

.more:hover { color: var(--accent); }

/* 格内快速输入 */
.quick {
  flex: none;
  width: 100%;
  font: inherit;
  font-size: 11.5px;
  padding: 1px 5px;
  height: 18px;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.cell.dragover { border-color: var(--accent); background: var(--accent-bg); }

/* ── 当日面板 ────────────────────────────────────────────── */

.daypanel {
  flex: none;
  width: var(--dp-w);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -1px 0 0 var(--border-2);
}

.dp-head {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}

.dp-date { font-size: 15px; font-weight: 650; }
.dp-sub  { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.dp-head-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.dp-body {
  flex: 1;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 14px 10px 0;
}

.tl-hours { position: relative; }

.tl-hour {
  height: var(--hour-h);
  position: relative;
  border-top: 1px solid var(--border-2);
}

.tl-hour:first-child { border-top-color: transparent; }

.tl-hour span {
  position: absolute;
  left: 0; top: -7px;
  width: 46px;
  padding-right: 8px;
  text-align: right;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  background: var(--surface);
}

.tl-hour:first-child span { top: 2px; }

.tl-events {
  position: absolute;
  left: 54px;
  right: 6px;
  top: 10px;   /* 与 .dp-body 的 padding-top 对齐；高度由 JS 按 24 小时设置 */
}

.ev-block {
  position: absolute;
  padding: 3px 8px;
  border-radius: 7px;
  border: 1px solid var(--c-bd);
  border-left: 3px solid var(--c);
  background: var(--c-bg);
  color: var(--c);
  overflow: hidden;
  cursor: pointer;
  font-size: 12px;
  line-height: 1.35;
  transition: box-shadow .12s;
}

.ev-block:hover { box-shadow: var(--shadow-md); z-index: 5; }

.ev-block .eb-t {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ev-block .eb-m {
  font-size: 11px;
  opacity: .8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ev-block.short { padding: 1px 8px; display: flex; align-items: center; gap: 7px; }
.ev-block.short .eb-t { flex: none; }

.tl-now {
  position: absolute;
  left: 46px; right: 6px;
  height: 2px;
  background: var(--danger);
  border-radius: 2px;
  pointer-events: none;
  z-index: 6;
}

.tl-now::before {
  content: "";
  position: absolute;
  left: -5px; top: -3px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
}

/* 注意：.dp-empty 是 .tl-events 的子元素，而 .tl-events 本身已经偏移过了，
   所以这里从 0 开始，不要再叠一次 54px。 */
.dp-empty {
  position: absolute;
  left: 0; right: 0; top: 0;
  font-size: 13px;
  color: var(--text-3);
  pointer-events: none;
  padding-top: 8px;
}

/* ── 弹窗 ────────────────────────────────────────────────── */

.dlg {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  color: var(--text);
  padding: 0;
  width: min(460px, calc(100vw - 32px));
  box-shadow: var(--shadow-lg);
}

.dlg.wide {
  width: min(1000px, calc(100vw - 40px));
  max-height: calc(100vh - 40px);
  overflow: hidden;          /* 由里面的 .dlg-inner 负责滚动 */
}

.dlg::backdrop { background: rgba(12,15,20,.45); backdrop-filter: blur(2px); }

.dlg form, .dlg .dlg-inner { padding: 20px 22px 16px; }

.dlg.wide .dlg-inner {
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}

.dlg h2 {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 650;
}

.dlg h3 { margin: 0; font-size: 13px; font-weight: 650; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.field.narrow { width: 96px; flex: none; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

input[type=text], input[type=date], input[type=time], input[type=number],
textarea, select {
  font: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text);
  outline: none;
  width: 100%;
  transition: border-color .12s, box-shadow .12s;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}

textarea { resize: vertical; font-family: inherit; }

.swatches { display: flex; gap: 7px; flex-wrap: wrap; }

.sw {
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform .1s;
}

.sw:hover { transform: scale(1.1); }

.sw[aria-pressed="true"] {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--surface) inset;
}

.dlg-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border-2);
}

.spacer { flex: 1; }

.dlg.wide .dlg-foot { position: sticky; bottom: 0; background: var(--surface);
                      margin: 18px -22px -16px; padding: 12px 22px; }

/* ── 课程表 ──────────────────────────────────────────────── */

.term-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
}

.term-bar label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
}

.term-bar input[type=date] { width: 160px; }

.excl-wrap { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

.excl-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  padding: 3px 5px 3px 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}

.excl-chip button {
  border: 0; background: none; cursor: pointer;
  color: var(--text-3); font-size: 13px; line-height: 1; padding: 0 2px;
}

.excl-chip button:hover { color: var(--danger); }

.excl-wrap input[type=date] { width: 150px; }

.hint {
  font-size: 12px;
  color: var(--text-2);
  background: var(--accent-bg);
  border-radius: 8px;
  padding: 8px 11px;
  margin: 0 0 12px;
  line-height: 1.6;
}

.ct-wrap { overflow: auto; max-height: min(46vh, 470px);
           border: 1px solid var(--border); border-radius: var(--r); }

.ct-grid {
  display: grid;
  user-select: none;
  min-width: 620px;
}

.ct-grid .hd {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  padding: 6px 4px;
}

.ct-grid .hd.corner {
  position: sticky; left: 0; z-index: 3;
  border-right: 1px solid var(--border);
  font-weight: 500;
  color: var(--text-3);
  font-size: 11px;
  line-height: 1.3;
}

.ct-grid .rowlab {
  position: sticky; left: 0; z-index: 1;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  padding: 3px 0;
  line-height: 1.25;
}

.ct-cell {
  border-bottom: 1px solid var(--border-2);
  border-right: 1px solid var(--border-2);
  min-height: 34px;
  padding: 2px;
  cursor: cell;
  /* 纵向堆叠：同一格里有多门课时上下排开，而不是并排挤成窄条 */
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: stretch;
  justify-content: center;
}

.ct-cell.last { border-right: 0; }

.ct-cell:hover { background: var(--surface-2); }

.ct-cell.in-sel { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }

.ct-slot {
  width: 100%;
  flex: none;
  min-height: 17px;
  border-radius: 6px;
  border-left: 3px solid var(--c);
  background: var(--c-bg);
  color: var(--c);
  font-size: 11px;
  line-height: 1.3;
  padding: 2px 5px;
  overflow: hidden;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
}

.ct-slot .nm {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ct-slot .lc {
  font-size: 10px;
  opacity: .78;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-left: 5px;
}

.ct-slot.cont-top { border-top-left-radius: 0; border-top-right-radius: 0; }
.ct-slot.cont-bot { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

.ct-bulk {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 9px 12px;
  border-radius: var(--r);
  background: var(--accent-bg);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  font-size: 13px;
}

.ct-bulk select { width: auto; min-width: 150px; padding: 5px 8px; }

.course-list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 8px;
}

.course-list { display: flex; flex-direction: column; gap: 6px; }

.course-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--surface-2);
  cursor: pointer;
}

.course-row:hover { border-color: var(--text-3); background: var(--surface); }

.course-row .dot { width: 12px; height: 12px; border-radius: 4px; flex: none;
                   background: var(--c); }
.course-row .cn { font-weight: 600; font-size: 13px; }
.course-row .meta { font-size: 12px; color: var(--text-3); }
.course-row .slots { font-size: 12px; color: var(--text-2); margin-left: auto; text-align: right; }
.course-row .cnt { font-size: 11px; color: var(--text-3); flex: none; }

.empty-note {
  font-size: 13px;
  color: var(--text-3);
  padding: 14px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--r);
}

.periods { margin-top: 16px; }
.periods summary { font-size: 13px; cursor: pointer; color: var(--text-2); padding: 6px 0; }
.periods summary:hover { color: var(--text); }

.periods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
  gap: 7px;
  margin: 8px 0 10px;
}

.periods-grid label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-2);
}

.periods-grid label b { width: 22px; text-align: right; flex: none; font-weight: 500; }
.periods-grid input[type=time] { padding: 4px 6px; font-size: 12px; }

.gen-note { font-size: 12px; color: var(--text-3); }

/* ── Toast ───────────────────────────────────────────────── */

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--surface);
  font-size: 13px;
  padding: 9px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  pointer-events: none;
  animation: toast-in .18s ease-out;
}

@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

/* ── 窄屏 ────────────────────────────────────────────────── */

@media (max-width: 900px) {
  .daypanel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(430px, 100vw);
    z-index: 80;
    box-shadow: var(--shadow-lg);
  }
  .month-nav { margin-right: 0; }
  .brand h1 { display: none; }
  .ct-wrap { max-height: 44vh; }
}

@media (max-width: 620px) {
  .week-badge { display: none; }
  .topbar { gap: 8px; padding: 8px 10px; }
  .month { padding: 8px 8px 10px; }
  .cell { padding: 3px; border-radius: 8px; }
  .chip { font-size: 10.5px; }
  .switch span { display: none; }
  .switch.big span { display: block; }
}

</style>
