<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日程 · 日历</title>
<!-- 由 tools/build.js 自动生成，请勿直接修改；改动请改源码后重新 npm run build -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><rect x='20' y='26' width='60' height='54' rx='8' fill='white'/><rect x='20' y='26' width='60' height='14' rx='7' fill='%23bfdbfe'/><rect x='32' y='12' width='7' height='20' rx='3.5' fill='white'/><rect x='61' y='12' width='7' height='20' rx='3.5' fill='white'/><rect x='30' y='50' width='14' height='10' rx='3' fill='%232563eb'/><rect x='50' y='50' width='14' height='10' rx='3' fill='%2393c5fd'/><rect x='30' y='65' width='14' height='10' rx='3' fill='%2393c5fd'/></svg>">
<style>
/* ══════════════════════════════════════════════════════════
   日程 · 日历   样式表
   ══════════════════════════════════════════════════════════ */

:root {
  --bg:        #f4f5f7;
  --surface:   #ffffff;
  --surface-2: #fafbfc;
  --border:    #e3e6ea;
  --border-2:  #eef0f3;
  --text:      #1b1f24;
  --text-2:    #5b6470;
  --text-3:    #98a1ad;
  --accent:    #2563eb;
  --accent-bg: #e8effd;
  --danger:    #dc2626;
  --today-bg:  #eef4ff;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-md: 0 4px 12px rgba(16,24,40,.10), 0 2px 4px rgba(16,24,40,.06);
  --shadow-lg: 0 16px 48px rgba(16,24,40,.18), 0 4px 12px rgba(16,24,40,.08);
  --r:  10px;
  --r-lg: 16px;
  --hour-h: 58px;
  --dp-w: 400px;
  --tp-w: 264px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0f1115;
    --surface:   #171a1f;
    --surface-2: #1c2027;
    --border:    #2a2f38;
    --border-2:  #23272f;
    --text:      #e8eaed;
    --text-2:    #9aa3af;
    --text-3:    #6b7480;
    --accent:    #60a5fa;
    --accent-bg: #1b2740;
    --danger:    #f87171;
    --today-bg:  #182238;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.6);
  }
}

* { box-sizing: border-box; }

/* 这些元素在别处显式写了 display，会盖掉浏览器对 [hidden] 的默认处理，
   所以统一补一条。 */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ── 顶栏 ────────────────────────────────────────────────── */

.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 9px; }

.brand h1 {
  font-size: 15px;
  font-weight: 650;
  margin: 0;
  letter-spacing: .01em;
}

.logo {
  width: 18px; height: 18px;
  border-radius: 5px;
  background: var(--accent);
  box-shadow: inset 0 -6px 0 rgba(255,255,255,.45);
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-right: auto;
}

.month-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 170px;
}

#btn-month {
  background: none;
  border: 0;
  padding: 2px 4px;
  border-radius: 6px;
  font: inherit;
  font-size: 16px;
  font-weight: 650;
  color: var(--text);
  cursor: pointer;
}

#btn-month:hover { background: var(--surface-2); }

.week-badge {
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
}

.week-badge:empty { display: none; }

.topbar-actions { display: flex; align-items: center; gap: 10px; }

/* ── 通用控件 ────────────────────────────────────────────── */

.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}

.btn:hover  { background: var(--surface-2); border-color: var(--text-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--border); }
.btn.danger { color: var(--danger); }
.btn.danger.ghost:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.btn.sm { padding: 4px 9px; font-size: 12px; }

.icon-btn {
  font: inherit;
  font-size: 17px;
  line-height: 1;
  width: 30px; height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
}

.icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}

.switch input { accent-color: var(--accent); margin: 0; cursor: pointer; }
.switch.big { gap: 9px; padding: 9px 11px; border: 1px solid var(--border);
              border-radius: var(--r); background: var(--surface-2); align-items: flex-start; }
.switch.big span { font-size: 13px; line-height: 1.45; }
.switch.big b { color: var(--text); }

/* 下拉菜单 */
.menu-wrap { position: relative; }

.menu {
  position: absolute;
  right: 0; top: calc(100% + 6px);
  min-width: 190px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  padding: 5px;
  z-index: 60;
}

.menu button {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--text);
  cursor: pointer;
}

.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--border-2); margin: 5px 2px; }

/* ── 主体布局 ────────────────────────────────────────────── */

.layout {
  flex: 1;
  display: flex;
  min-height: 0;
}

.month {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 10px 12px 12px;
  gap: 6px;
}

.weekdays {
  flex: none;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.weekdays span {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: .06em;
  padding-bottom: 2px;
}

.weekdays span.we { color: color-mix(in srgb, var(--accent) 70%, var(--text-3)); }

.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  min-height: 0;
}

/* ── 左侧任务栏 ──────────────────────────────────────────── */

.tasks {
  flex: none;
  width: var(--tp-w);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  box-shadow: 1px 0 0 var(--border-2);
}

.tp-head {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 12px 10px 10px 14px;
  border-bottom: 1px solid var(--border);
}

.tp-headtext { min-width: 0; }
.tp-date { font-size: 14px; font-weight: 650; }
.tp-sub  { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.tp-head .icon-btn { margin-left: auto; flex: none; }

.tp-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 12px 12px 14px;
}

.tp-sec { margin-bottom: 14px; }
.tp-sec:last-child { margin-bottom: 0; }

.tp-h {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 650;
  color: var(--text-2);
}

.tp-n {
  font-size: 11px;
  font-weight: 500;
  line-height: 16px;
  padding: 0 6px;
  border-radius: 999px;
  color: var(--text-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.tp-list { display: flex; flex-direction: column; gap: 4px; }

.tp-empty {
  margin: 0;
  padding: 6px 9px;
  font-size: 12px;
  color: var(--text-3);
  border: 1px dashed var(--border);
  border-radius: 8px;
}

.tp-done { margin-top: 4px; }
.tp-done summary {
  font-size: 12px;
  color: var(--text-3);
  cursor: pointer;
  padding: 5px 0;
  user-select: none;
}
.tp-done summary:hover { color: var(--text); }
.tp-done .tp-list { margin-top: 4px; }

.tp-add {
  flex: none;
  display: flex;
  gap: 6px;
  padding: 9px 12px 9px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}

.tp-add input { flex: 1; min-width: 0; padding: 5px 9px; font-size: 13px; }

/* ── 可勾掉的一条（任务栏与当日备忘录共用）──────────────── */

.todo {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 6px 5px 8px;
  border-radius: 8px;
  border-left: 3px solid var(--c, var(--border));
  background: var(--c-bg, transparent);
}

.todo:hover { background: var(--c-bg, var(--surface-2)); }
.todo.done:hover { background: var(--surface-2); }

.todo-chk {
  flex: none;
  width: 15px; height: 15px;
  margin: 2px 0 0;
  accent-color: var(--c, var(--accent));
  cursor: pointer;
}

.todo-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  cursor: text;
}

.todo-t {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
  overflow-wrap: anywhere;
}

.todo-sub {
  font-size: 11.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.todo-del {
  flex: none;
  width: 20px; height: 20px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s, background .12s, color .12s;
}

.todo:hover .todo-del { opacity: 1; }
.todo-del:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

.todo-edit {
  width: 100%;
  font: inherit;
  font-size: 13px;
  padding: 1px 6px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.todo.done { border-left-color: var(--border); background: transparent; }
.todo.done .todo-t { color: var(--text-3); text-decoration: line-through; }
.todo.done .todo-sub { opacity: .7; }

/* ── 月历格子 ────────────────────────────────────────────── */

.cell {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  padding: 4px 5px 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color .12s, box-shadow .12s;
}

.cell:hover { border-color: var(--text-3); box-shadow: var(--shadow-sm); }

.cell.other { background: var(--surface-2); opacity: .55; }
.cell.other .dnum { color: var(--text-3); }

.cell.today {
  background: var(--today-bg);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset;
}

.cell.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
}

.cell-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 3px;
  min-height: 20px;
}

.dnum {
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 20px;
  min-width: 20px;
  text-align: center;
  border-radius: 6px;
  padding: 0 3px;
}

.cell.today .dnum { background: var(--accent); color: #fff; }

.cell-head .spacer { flex: 1; }

.add-btn {
  flex: none;
  width: 20px; height: 20px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 15px; line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s, background .12s;
}

.cell:hover .add-btn { opacity: 1; }
.add-btn:hover { background: var(--accent); color: #fff; }

.cell-events {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-height: 0;
  overflow: hidden;
}

/* 事件小条 */
.chip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 1px 5px;
  border-radius: 5px;
  border-left: 3px solid var(--c);
  background: var(--c-bg);
  color: var(--c);
  font-size: 11.5px;
  line-height: 16px;
  height: 18px;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  flex: none;
}

.chip:hover { filter: brightness(.94); }
.chip .t { font-variant-numeric: tabular-nums; opacity: .78; flex: none; }
.chip .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 小格子里的「勾掉」圈。
   用绝对定位压在标题末尾，不占宽度——格子里本来就窄，
   再切走 18px 的话标题就只剩省略号了。平时不显示，移上去才露出来。 */
.chip-chk {
  position: absolute;
  right: 3px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--c);
  background: var(--c-bg);
  color: transparent;
  font-size: 8px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s, background .12s, color .12s;
}

.chip:hover .chip-chk { opacity: 1; }
.chip-chk:hover { background: var(--c); color: var(--surface); }

.chip.done .chip-chk {
  opacity: 1;
  background: var(--c);
  color: var(--surface);
}

.chip.important { font-weight: 650; }
.chip.important .n::before { content: "★ "; font-size: 9px; }

.chip.done { opacity: .5; }
.chip.done .n { text-decoration: line-through; }

.more {
  flex: none;
  font-size: 11px;
  color: var(--text-3);
  padding-left: 6px;
  cursor: pointer;
}

.more:hover { color: var(--accent); }

/* 格内快速输入 */
.quick {
  flex: none;
  width: 100%;
  font: inherit;
  font-size: 11.5px;
  padding: 1px 5px;
  height: 18px;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.cell.dragover { border-color: var(--accent); background: var(--accent-bg); }

/* ── 当日面板 ────────────────────────────────────────────── */

.daypanel {
  flex: none;
  width: var(--dp-w);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -1px 0 0 var(--border-2);
}

.dp-head {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}

.dp-date { font-size: 15px; font-weight: 650; }
.dp-sub  { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.dp-head-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.dp-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* 时间轴自己滚。原来的滚动条在 .dp-body 上，现在下面多了备忘录区，
   所以单独包一层，.tl-events / .tl-now 的定位基准也变成它。 */
.dp-tl {
  flex: 1;
  position: relative;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 14px 10px 0;
}

/* ── 当日面板里的备忘录 ──────────────────────────────────── */

.dp-memos {
  flex: none;
  display: flex;
  flex-direction: column;
  max-height: 40%;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.dp-memo-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 6px;
}

.dp-memo-t { font-size: 12px; font-weight: 650; color: var(--text-2); }
.dp-memo-c { font-size: 11px; color: var(--text-3); }
.dp-memo-c:empty { display: none; }

.dp-memo-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.memo-empty { margin: 2px 0 0; font-size: 12px; color: var(--text-3); }

.dp-memo-add { flex: none; display: flex; gap: 6px; margin-top: 7px; }
.dp-memo-add input { flex: 1; min-width: 0; padding: 5px 9px; font-size: 12.5px; }

.tl-hours { position: relative; }

.tl-hour {
  height: var(--hour-h);
  position: relative;
  border-top: 1px solid var(--border-2);
}

.tl-hour:first-child { border-top-color: transparent; }

.tl-hour span {
  position: absolute;
  left: 0; top: -7px;
  width: 46px;
  padding-right: 8px;
  text-align: right;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  background: var(--surface);
}

.tl-hour:first-child span { top: 2px; }

.tl-events {
  position: absolute;
  left: 54px;
  right: 6px;
  top: 10px;   /* 与 .dp-body 的 padding-top 对齐；高度由 JS 按 24 小时设置 */
}

.ev-block {
  position: absolute;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 3px 8px 3px 6px;
  border-radius: 7px;
  border: 1px solid var(--c-bd);
  border-left: 3px solid var(--c);
  background: var(--c-bg);
  color: var(--c);
  overflow: hidden;
  cursor: pointer;
  font-size: 12px;
  line-height: 1.35;
  transition: box-shadow .12s;
}

.ev-block:hover { box-shadow: var(--shadow-md); z-index: 5; }

.ev-c { flex: 1; min-width: 0; }

/* 勾掉这一件事的圆圈 */
.eb-chk {
  flex: none;
  width: 14px; height: 14px;
  margin-top: 1px;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--c);
  background: transparent;
  color: transparent;
  font-size: 9px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: .4;
  transition: opacity .12s, background .12s, color .12s;
}

.ev-block:hover .eb-chk { opacity: 1; }
.eb-chk:hover { background: var(--c); color: var(--surface); }

.ev-block.done { opacity: .55; }
.ev-block.done .eb-t { text-decoration: line-through; }
.ev-block.done .eb-chk { opacity: 1; background: var(--c); color: var(--surface); }

.ev-block .eb-t {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ev-block .eb-m {
  font-size: 11px;
  opacity: .8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ev-block.short { padding: 1px 8px 1px 6px; align-items: center; }
.ev-block.short .eb-c { display: flex; align-items: center; gap: 7px; }
.ev-block.short .eb-t { flex: none; }

.tl-now {
  position: absolute;
  left: 46px; right: 6px;
  height: 2px;
  background: var(--danger);
  border-radius: 2px;
  pointer-events: none;
  z-index: 6;
}

.tl-now::before {
  content: "";
  position: absolute;
  left: -5px; top: -3px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
}

/* 注意：.dp-empty 是 .tl-events 的子元素，而 .tl-events 本身已经偏移过了，
   所以这里从 0 开始，不要再叠一次 54px。 */
.dp-empty {
  position: absolute;
  left: 0; right: 0; top: 0;
  font-size: 13px;
  color: var(--text-3);
  pointer-events: none;
  padding-top: 8px;
}

/* ── 弹窗 ────────────────────────────────────────────────── */

.dlg {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  color: var(--text);
  padding: 0;
  width: min(460px, calc(100vw - 32px));
  box-shadow: var(--shadow-lg);
}

.dlg.wide {
  width: min(1000px, calc(100vw - 40px));
  max-height: calc(100vh - 40px);
  overflow: hidden;          /* 由里面的 .dlg-inner 负责滚动 */
}

.dlg::backdrop { background: rgba(12,15,20,.45); backdrop-filter: blur(2px); }

.dlg form, .dlg .dlg-inner { padding: 20px 22px 16px; }

.dlg.wide .dlg-inner {
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}

.dlg h2 {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 650;
}

.dlg h3 { margin: 0; font-size: 13px; font-weight: 650; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.field.narrow { width: 96px; flex: none; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

input[type=text], input[type=date], input[type=time], input[type=number],
textarea, select {
  font: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text);
  outline: none;
  width: 100%;
  transition: border-color .12s, box-shadow .12s;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}

textarea { resize: vertical; font-family: inherit; }

.swatches { display: flex; gap: 7px; flex-wrap: wrap; }

.sw {
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform .1s;
}

.sw:hover { transform: scale(1.1); }

.sw[aria-pressed="true"] {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--surface) inset;
}

.dlg-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border-2);
}

.spacer { flex: 1; }

.dlg.wide .dlg-foot { position: sticky; bottom: 0; background: var(--surface);
                      margin: 18px -22px -16px; padding: 12px 22px; }

/* ── 课程表 ──────────────────────────────────────────────── */

.term-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
}

.term-bar label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
}

.term-bar input[type=date] { width: 160px; }

.excl-wrap { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

.excl-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  padding: 3px 5px 3px 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}

.excl-chip button {
  border: 0; background: none; cursor: pointer;
  color: var(--text-3); font-size: 13px; line-height: 1; padding: 0 2px;
}

.excl-chip button:hover { color: var(--danger); }

.excl-wrap input[type=date] { width: 150px; }

.hint {
  font-size: 12px;
  color: var(--text-2);
  background: var(--accent-bg);
  border-radius: 8px;
  padding: 8px 11px;
  margin: 0 0 12px;
  line-height: 1.6;
}

.ct-wrap { overflow: auto; max-height: min(46vh, 470px);
           border: 1px solid var(--border); border-radius: var(--r); }

.ct-grid {
  display: grid;
  user-select: none;
  min-width: 620px;
}

.ct-grid .hd {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  padding: 6px 4px;
}

.ct-grid .hd.corner {
  position: sticky; left: 0; z-index: 3;
  border-right: 1px solid var(--border);
  font-weight: 500;
  color: var(--text-3);
  font-size: 11px;
  line-height: 1.3;
}

.ct-grid .rowlab {
  position: sticky; left: 0; z-index: 1;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  padding: 3px 0;
  line-height: 1.25;
}

.ct-cell {
  border-bottom: 1px solid var(--border-2);
  border-right: 1px solid var(--border-2);
  min-height: 34px;
  padding: 2px;
  cursor: cell;
  /* 纵向堆叠：同一格里有多门课时上下排开，而不是并排挤成窄条 */
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: stretch;
  justify-content: center;
}

.ct-cell.last { border-right: 0; }

.ct-cell:hover { background: var(--surface-2); }

.ct-cell.in-sel { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }

.ct-slot {
  width: 100%;
  flex: none;
  min-height: 17px;
  border-radius: 6px;
  border-left: 3px solid var(--c);
  background: var(--c-bg);
  color: var(--c);
  font-size: 11px;
  line-height: 1.3;
  padding: 2px 5px;
  overflow: hidden;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
}

.ct-slot .nm {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ct-slot .lc {
  font-size: 10px;
  opacity: .78;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-left: 5px;
}

.ct-slot.cont-top { border-top-left-radius: 0; border-top-right-radius: 0; }
.ct-slot.cont-bot { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

.ct-bulk {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 9px 12px;
  border-radius: var(--r);
  background: var(--accent-bg);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  font-size: 13px;
}

.ct-bulk select { width: auto; min-width: 150px; padding: 5px 8px; }

.course-list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 8px;
}

.course-list { display: flex; flex-direction: column; gap: 6px; }

.course-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--surface-2);
  cursor: pointer;
}

.course-row:hover { border-color: var(--text-3); background: var(--surface); }

.course-row .dot { width: 12px; height: 12px; border-radius: 4px; flex: none;
                   background: var(--c); }
.course-row .cn { font-weight: 600; font-size: 13px; }
.course-row .meta { font-size: 12px; color: var(--text-3); }
.course-row .slots { font-size: 12px; color: var(--text-2); margin-left: auto; text-align: right; }
.course-row .cnt { font-size: 11px; color: var(--text-3); flex: none; }

.empty-note {
  font-size: 13px;
  color: var(--text-3);
  padding: 14px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--r);
}

.periods { margin-top: 16px; }
.periods summary { font-size: 13px; cursor: pointer; color: var(--text-2); padding: 6px 0; }
.periods summary:hover { color: var(--text); }

.periods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
  gap: 7px;
  margin: 8px 0 10px;
}

.periods-grid label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-2);
}

.periods-grid label b { width: 22px; text-align: right; flex: none; font-weight: 500; }
.periods-grid input[type=time] { padding: 4px 6px; font-size: 12px; }

.gen-note { font-size: 12px; color: var(--text-3); }

/* ── 云同步 ──────────────────────────────────────────────── */

/* 顶栏「⋯」上的小圆点：只在出错/冲突/同步中才出现 */
.sync-dot {
  position: absolute;
  top: 3px; right: 3px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-3);
  box-shadow: 0 0 0 2px var(--surface);
}

.sync-dot.bad  { background: var(--danger); }
.sync-dot.warn { background: #d97706; }
.sync-dot.busy { background: var(--accent); }

#btn-menu { position: relative; }

.sy-line {
  font-size: 12.5px;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 11px;
  margin-bottom: 12px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.sy-line.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent);
               background: color-mix(in srgb, var(--danger) 8%, transparent); }
.sy-line.ok  { color: var(--text); border-color: color-mix(in srgb, var(--accent) 35%, transparent);
               background: var(--accent-bg); }

.sy-conflict {
  border: 1px solid color-mix(in srgb, #d97706 45%, transparent);
  background: color-mix(in srgb, #d97706 9%, transparent);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 12px;
}

.sy-conflict h3 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }

.sy-cf-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12.5px;
  line-height: 1.6;
  margin-bottom: 4px;
  color: var(--text);
}

.sy-cf-tag {
  flex: none;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
}

.sy-cf-tag.cloud { border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); }

.sy-cf-note { margin: 8px 0 10px; font-size: 12px; color: var(--text-2); line-height: 1.55; }

.sy-cf-btns { display: flex; gap: 7px; flex-wrap: wrap; }

.sy-backup {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-2);
  padding: 8px 11px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  margin-bottom: 12px;
}

.sy-backup .btn { margin-left: auto; }

/* ── Toast ───────────────────────────────────────────────── */

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--surface);
  font-size: 13px;
  padding: 9px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  pointer-events: none;
  animation: toast-in .18s ease-out;
}

@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

/* ── 窄屏 ────────────────────────────────────────────────── */

@media (max-width: 1100px) {
  :root { --tp-w: 232px; --dp-w: 340px; }
}

@media (max-width: 900px) {
  .daypanel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(430px, 100vw);
    z-index: 80;
    box-shadow: var(--shadow-lg);
  }
  /* 窄屏上任务栏改成抽屉，展开时盖在日历上 */
  .tasks {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(320px, 100vw);
    z-index: 81;
    box-shadow: var(--shadow-lg);
  }
  .month-nav { margin-right: 0; }
  .brand h1 { display: none; }
  .ct-wrap { max-height: 44vh; }
}

@media (max-width: 620px) {
  .week-badge { display: none; }
  .topbar { gap: 8px; padding: 8px 10px; }
  .month { padding: 8px 8px 10px; }
  .cell { padding: 3px; border-radius: 8px; }
  .chip { font-size: 10.5px; }
  .switch span { display: none; }
  .switch.big span { display: block; }
}

</style>
</head>
<body>

<div class="app">

  <!-- ── 顶栏 ─────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>日程</h1>
    </div>

    <div class="month-nav">
      <button class="icon-btn" id="btn-prev" title="上个月 (←)">‹</button>
      <div class="month-title">
        <button id="btn-month" title="选择月份"><span id="mtitle">—</span></button>
        <span class="week-badge" id="week-badge"></span>
      </div>
      <button class="icon-btn" id="btn-next" title="下个月 (→)">›</button>
      <button class="btn ghost" id="btn-today" title="回到今天 (T)">今天</button>
    </div>

    <div class="topbar-actions">
      <label class="switch" title="只显示标为重要的日程">
        <input type="checkbox" id="chk-important">
        <span>只看重要</span>
      </label>
      <button class="btn" id="btn-tasks" title="展开任务栏 (M)" aria-pressed="true">任务</button>
      <button class="btn" id="btn-courses" title="批量编辑课程表 (C)">课程表</button>
      <div class="menu-wrap">
        <button class="icon-btn" id="btn-menu" title="更多">⋯<span class="sync-dot" id="sync-dot" hidden></span></button>
        <div class="menu" id="menu" hidden>
          <button data-act="sync"><span id="sy-menu-label">云同步 · 未开启</span></button>
          <hr>
          <button data-act="export">导出数据 (JSON)</button>
          <button data-act="import">导入数据 (JSON)</button>
          <hr>
          <button data-act="demo">载入示例课程</button>
          <button data-act="clear" class="danger">清空全部数据</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ── 主体 ─────────────────────────────────────────────── -->
  <main class="layout">

    <!-- ── 左侧任务栏：选中那一天要做的所有事 ── -->
    <aside class="tasks" id="taskpanel">
      <header class="tp-head">
        <div class="tp-headtext">
          <div class="tp-date" id="tp-date">—</div>
          <div class="tp-sub" id="tp-sub"></div>
        </div>
        <button class="icon-btn" id="tp-hide" title="收起任务栏">✕</button>
      </header>
      <div class="tp-body" id="tp-body"></div>
      <form class="tp-add" id="form-tpadd">
        <input type="text" id="tp-input" placeholder="加条提醒，回车保存…" maxlength="300" autocomplete="off">
        <button class="btn sm primary" type="submit">加</button>
      </form>
    </aside>

    <section class="month">
      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="daypanel" id="daypanel" hidden>
      <header class="dp-head">
        <div>
          <div class="dp-date" id="dp-date">—</div>
          <div class="dp-sub" id="dp-sub"></div>
        </div>
        <div class="dp-head-actions">
          <button class="btn" id="dp-add">+ 新建</button>
          <button class="icon-btn" id="dp-close" title="收起 (Esc)">✕</button>
        </div>
      </header>
      <div class="dp-body" id="dp-body">

        <!-- 备忘录：这一天的小提醒，勾一下就划掉 -->
        <div class="dp-memos" id="dp-memos">
          <div class="dp-memo-head">
            <span class="dp-memo-t">备忘录</span>
            <span class="dp-memo-c" id="dp-memo-c"></span>
          </div>
          <div class="dp-memo-list" id="dp-memo-list"></div>
          <form class="dp-memo-add" id="form-memo">
            <input type="text" id="memo-input" placeholder="例如：记得交实验报告" maxlength="300" autocomplete="off">
            <button class="btn sm primary" type="submit">加</button>
          </form>
        </div>

        <div class="dp-tl" id="dp-tl">
          <div class="tl-hours" id="tl-hours"></div>
          <div class="tl-events" id="tl-events"></div>
          <div class="tl-now" id="tl-now" hidden></div>
        </div>
      </div>
    </aside>

  </main>
</div>

<!-- ── 日程编辑弹窗 ───────────────────────────────────────── -->
<dialog class="dlg" id="dlg-event">
  <form method="dialog" id="form-event">
    <h2 id="ev-title-h">新建日程</h2>

    <div class="field">
      <label for="ev-title">标题</label>
      <input type="text" id="ev-title" placeholder="例如：高等数学 / 交材料 / 和导师讨论" required autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="ev-date">日期</label>
        <input type="date" id="ev-date" required>
      </div>
      <div class="field narrow">
        <label for="ev-start">开始</label>
        <input type="time" id="ev-start" step="300" required>
      </div>
      <div class="field narrow">
        <label for="ev-end">结束</label>
        <input type="time" id="ev-end" step="300" required>
      </div>
    </div>

    <div class="field">
      <label for="ev-note">备注</label>
      <textarea id="ev-note" rows="2" placeholder="地点、老师、要带的东西…"></textarea>
    </div>

    <div class="field">
      <label>颜色</label>
      <div class="swatches" id="ev-colors"></div>
    </div>

    <label class="switch big">
      <input type="checkbox" id="ev-important">
      <span><b>标记为重要</b> — 在月历格子里始终优先显示</span>
    </label>

    <label class="switch big">
      <input type="checkbox" id="ev-done">
      <span><b>已完成</b> — 划掉，并收进任务栏的「已完成」里</span>
    </label>

    <div class="dlg-foot">
      <button type="button" class="btn danger ghost" id="ev-delete">删除</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="ev-cancel">取消</button>
      <button type="submit" class="btn primary" id="ev-save">保存</button>
    </div>
  </form>
</dialog>

<!-- ── 课程表弹窗 ────────────────────────────────────────── -->
<dialog class="dlg wide" id="dlg-courses">
  <div class="dlg-inner">
    <h2>课程表</h2>

    <div class="term-bar">
      <label>第 1 周周一
        <input type="date" id="term-start">
      </label>
      <label>排除日期（节假日等）
        <span class="excl-wrap" id="excl-wrap"></span>
      </label>
    </div>

    <p class="hint">
      在下面的格子里 <b>按住鼠标拖动框选</b> 可一次选中多格，然后批量设置课程。
      单元格里的 <b>1-2</b> 表示占第 1、2 节。
    </p>

    <div class="ct-wrap">
      <div class="ct-grid" id="ct-grid"></div>
    </div>

    <div class="ct-bulk" id="ct-bulk" hidden>
      已选 <b id="ct-selcount">0</b> 格：
      <select id="ct-pick"></select>
      <button class="btn primary sm" id="ct-apply">填入</button>
      <button class="btn sm" id="ct-clear">清除</button>
      <button class="btn ghost sm" id="ct-cancel-sel">取消选择</button>
    </div>

    <div class="course-list-head">
      <h3>课程列表</h3>
      <button class="btn sm" id="ct-new">+ 新建课程</button>
    </div>
    <div class="course-list" id="course-list"></div>

    <details class="periods">
      <summary>节次时间设置</summary>
      <div class="periods-grid" id="periods-grid"></div>
      <button class="btn sm" id="periods-reset">恢复默认（北航）</button>
    </details>

    <div class="dlg-foot">
      <span class="gen-note" id="gen-note"></span>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="ct-wipe">清除课表日程</button>

<script>
/* ══════════════════════════════════════════════════════════
   store.js — 数据模型 / 本地存储 / 课程展开
   全部挂在全局 Sched 上，供其它脚本使用。
   ══════════════════════════════════════════════════════════ */

var Sched = (function () {
  'use strict';

  var KEY = 'schedule.v1';

  /* 数据结构版本。云同步靠它挡住「旧客户端把新字段写坏」：
     云端版本高于本机认识的就拒绝推送。加字段时 +1。
     注意 localStorage 的键名 KEY 不带版本号，是故意的——
     升级靠 normalize 就地兼容，不换键，免得老数据读不到。 */
  var VERSION = 2;

  /* 纯界面偏好，跟数据本身无关，所以单独存、也不参与同步：
     不然在电脑上点一下「只看重要」就会把手机上一整天的排课顶掉。 */
  var UIKEY = 'schedule.ui';

  /* ── 调色板 ────────────────────────────────────────────────
     每个颜色给亮/暗两套 hex：亮色主题用深一点的，暗色主题用浅一点的，
     这样两种主题下文字对比度都够。                            */
  var PALETTE = [
    { id: 'blue',   name: '蓝', light: '#2563eb', dark: '#60a5fa' },
    { id: 'violet', name: '紫', light: '#7c3aed', dark: '#a78bfa' },
    { id: 'pink',   name: '粉', light: '#db2777', dark: '#f472b6' },
    { id: 'red',    name: '红', light: '#dc2626', dark: '#f87171' },
    { id: 'orange', name: '橙', light: '#ea580c', dark: '#fb923c' },
    { id: 'amber',  name: '黄', light: '#b45309', dark: '#fbbf24' },
    { id: 'green',  name: '绿', light: '#059669', dark: '#34d399' },
    { id: 'teal',   name: '青', light: '#0d9488', dark: '#2dd4bf' },
    { id: 'slate',  name: '灰', light: '#475569', dark: '#94a3b8' }
  ];

  /* 北航作息，共 14 节：上午 1-5、下午 6-10、晚上 11-14。
     可在课程表弹窗的「节次时间设置」里改。 */
  var DEFAULT_PERIODS = [
    { start: '08:00', end: '08:45' },  // 1
    { start: '08:50', end: '09:35' },  // 2
    { start: '09:50', end: '10:35' },  // 3
    { start: '10:40', end: '11:25' },  // 4
    { start: '11:30', end: '12:15' },  // 5
    { start: '14:00', end: '14:45' },  // 6
    { start: '14:50', end: '15:35' },  // 7
    { start: '15:50', end: '16:35' },  // 8
    { start: '16:40', end: '17:25' },  // 9
    { start: '17:30', end: '18:15' },  // 10
    { start: '19:00', end: '19:45' },  // 11
    { start: '19:50', end: '20:35' },  // 12
    { start: '20:40', end: '21:25' },  // 13
    { start: '21:30', end: '22:15' }   // 14
  ];

  var WEEKDAY_CN = ['一', '二', '三', '四', '五', '六', '日'];

  /* ── 日期小工具（全部按本地时区，日期用 YYYY-MM-DD 字符串表示）── */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function parseYmd(s) {
    var p = String(s).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function addDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }

  /** 该日期所在周的周一 */
  function mondayOf(d) {
    return addDays(d, -((d.getDay() + 6) % 7));
  }

  /** 0=周一 … 6=周日 */
  function weekdayIndex(d) { return (d.getDay() + 6) % 7; }

  function toMin(hhmm) {
    var p = String(hhmm || '00:00').split(':');
    return (+p[0] || 0) * 60 + (+p[1] || 0);
  }

  function minToTime(m) {
    m = Math.max(0, Math.min(1439, Math.round(m)));
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  }

  function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  /** 左侧任务栏在窄屏上默认收起，免得一进页面就盖住日历 */
  function roomForTaskPanel() {
    return typeof matchMedia === 'undefined' || matchMedia('(min-width: 901px)').matches;
  }

  /** 浅拷贝。normalize 系函数全靠它保住「这个版本还不认识的字段」。 */
  function copy(o) {
    var out = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
    return out;
  }

  /**
   * "1,3,5-9" → [1,3,5,6,7,8,9]
   * 分隔符逗号/顿号/分号/空格都认，区间可以用 - ~ 至。无法解析的片段直接跳过。
   */
  function parseWeeks(str) {
    var out = [], seen = {};
    String(str == null ? '' : str).split(/[,，、;；\s]+/).forEach(function (part) {
      if (!part) return;
      var m = /^(\d+)\s*[-~至]\s*(\d+)$/.exec(part);
      if (m) {
        var a = +m[1], b = +m[2];
        if (a > b) { var t = a; a = b; b = t; }
        for (var w = a; w <= b; w++) {
          if (w >= 1 && !seen[w]) { seen[w] = 1; out.push(w); }
        }
      } else if (/^\d+$/.test(part)) {
        var v = +part;
        if (v >= 1 && !seen[v]) { seen[v] = 1; out.push(v); }
      }
    });
    out.sort(function (x, y) { return x - y; });
    return out;
  }

  /** [1,3,5,6,7] → "1,3,5-7" */
  function formatWeeks(weeks) {
    if (!weeks || !weeks.length) return '';
    var s = weeks.slice().sort(function (a, b) { return a - b; });
    var parts = [], i = 0;
    while (i < s.length) {
      var j = i;
      while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
      parts.push(i === j ? String(s[i]) : s[i] + '-' + s[j]);
      i = j + 1;
    }
    return parts.join(',');
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ── 颜色解析 ────────────────────────────────────────────── */

  function isDark() {
    return typeof matchMedia !== 'undefined' &&
           matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function colorHex(id) {
    var p = null;
    for (var i = 0; i < PALETTE.length; i++) if (PALETTE[i].id === id) p = PALETTE[i];
    if (!p) p = PALETTE[0];
    return isDark() ? p.dark : p.light;
  }

  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  /**
   * 给元素挂上配色变量：
   *   --c     主题色（文字 / 左边框）
   *   --c-bg  淡背景
   *   --c-bd  边框
   */
  function applyColors(el, colorId) {
    var hex = colorHex(colorId);
    el.style.setProperty('--c', hex);
    el.style.setProperty('--c-bg', rgba(hex, isDark() ? 0.18 : 0.10));
    el.style.setProperty('--c-bd', rgba(hex, 0.22));
    return hex;
  }

  /* ── 状态 ────────────────────────────────────────────────── */

  function defaultState() {
    return {
      version: VERSION,
      events: [],
      memos: [],          // 每天的小提醒：没有时间，只有「做没做」
      courses: [],
      periods: DEFAULT_PERIODS.map(function (p) { return { start: p.start, end: p.end }; }),

      // 下面三个字段是给云同步认「这份数据是谁、什么时候写的」用的。
      // savedAt 只用来在冲突弹窗里显示「云端是 3 小时前的」，
      // 绝不用来判谁更新——两台设备的时钟不可信，比大小会让
      // 时钟慢的那台永远推不上去。真正的判据是 blob 的 sha。
      savedAt: 0,         // 0 = 从没被任何设备写过
      lastWriter: '',     // 最后一次写的设备 id
      lastSeq: '',        // 最后一次写的随机数，用来认「这次写是不是我发的」

      settings: {
        termStart: '',        // 第 1 周的周一，YYYY-MM-DD
        excludeDates: [],     // 全局排除（节假日）
        skipped: []           // 手动删掉的课程事件 originKey，重新生成时跳过
      }
    };
  }

  var state = defaultState();
  var listeners = [];
  var writerId = '';        // 本机 id，由 sync 注入；纯 node 环境下为空

  function onChange(fn) { listeners.push(fn); }
  function emit() { for (var i = 0; i < listeners.length; i++) listeners[i](); }

  /** 本机标识，只影响 lastWriter 字段 */
  function setWriter(id) { writerId = String(id == null ? '' : id); }

  /** 每次本地改动都盖一个「谁、什么时候、哪一次」的戳 */
  function stampWrite() {
    state.savedAt = Date.now();
    state.lastWriter = writerId;
    state.lastSeq = uid() + uid();
  }

  function load() {
    try {
      var raw = (typeof localStorage !== 'undefined') && localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        state = normalize(s);
      }
    } catch (e) {
      console.warn('读取本地数据失败，已使用空白数据', e);
    }
    loadUi();
    return state;
  }

  function save() {
    try {
      if (typeof localStorage === 'undefined') return true;
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      // 配额爆了或 Safari 无痕模式下会走到这里。以前只 console.warn，
      // 于是用户看得见改动、刷新就没了。现在让上层能知道并提示。
      console.warn('保存失败', e);
      return false;
    }
  }

  function commit() { stampWrite(); save(); emit(); }

  /**
   * 采纳云端内容：原样收下，**绝不刷新** savedAt / lastWriter / lastSeq。
   * 它们描述的是「这份数据是谁什么时候写的」，在这条路径上改了，
   * 两台设备就会你推我我推你地互相覆盖个没完。
   */
  function adopt(s) {
    state = normalize(s);
    save();
    emit();
    return state;
  }

  /* ── 本机界面偏好 ──────────────────────────────────────────
     和一些「设置」长得像，但性质完全不同：它们描述的是这台设备
     怎么看，不是日程本身。所以单独存一份，也不参与同步。      */

  var ui = { onlyImportant: false, showTasks: roomForTaskPanel() };

  function loadUi() {
    try {
      var raw = (typeof localStorage !== 'undefined') && localStorage.getItem(UIKEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === 'object') {
          ui.onlyImportant = !!s.onlyImportant;
          ui.showTasks = s.showTasks !== false;
        }
      }
    } catch (e) {
      console.warn('读取界面偏好失败，用默认值', e);
    }
    return ui;
  }

  function saveUi() {
    try {
      if (typeof localStorage !== 'undefined') localStorage.setItem(UIKEY, JSON.stringify(ui));
    } catch (e) {
      console.warn('保存界面偏好失败', e);
    }
  }

  /**
   * 兼容缺字段 / 脏数据。
   *
   * 关键：这里是**从输入复制一份、再覆盖已知字段**，而不是从空白对象重建。
   * 重建会把不认识的字段直接丢掉——以后版本加了新字段，旧客户端一读一写
   * 就把它们抹平了，而且看起来像是旧客户端「改」的。云端一并被带坏。
   * APK 装上去是不会自己更新的，所以「旧客户端」不是边缘情况，是常态。
   */
  function normalize(s) {
    var d = defaultState();
    if (!s || typeof s !== 'object') return d;

    var out = copy(s);

    out.version = +s.version || 1;
    out.savedAt = +s.savedAt || 0;      // 0 = 从没被写过，不是「很久以前」
    out.lastWriter = String(s.lastWriter || '');
    out.lastSeq = String(s.lastSeq || '');

    out.events = Array.isArray(s.events)
      ? s.events.filter(function (e) { return e && e.date && e.start; }).map(normEvent) : [];
    out.memos = Array.isArray(s.memos)
      ? s.memos.filter(function (m) { return m && m.date && m.text; }).map(normMemo) : [];
    out.courses = Array.isArray(s.courses)
      ? s.courses.filter(function (c) { return c && c.name; }).map(normCourse) : [];

    out.periods = (Array.isArray(s.periods) && s.periods.length)
      ? s.periods.filter(function (p) { return p && p.start && p.end; })
                 .map(function (p) { return { start: p.start, end: p.end }; })
      : d.periods;
    if (!out.periods.length) out.periods = d.periods;

    out.settings = copy(s.settings || {});
    out.settings.termStart = (s.settings && s.settings.termStart) || '';
    out.settings.excludeDates = (s.settings && Array.isArray(s.settings.excludeDates))
      ? s.settings.excludeDates : [];
    out.settings.skipped = (s.settings && Array.isArray(s.settings.skipped))
      ? s.settings.skipped : [];
    // 这两个是纯界面偏好，已经挪到本机（见 UIKEY）。老数据带的就删掉，
    // 别再跟着同步跑——不然在电脑上点一下「只看重要」就能顶掉手机上的排课。
    delete out.settings.onlyImportant;
    delete out.settings.showTasks;

    return out;
  }

  function normEvent(e) {
    var o = copy(e);              // 不认识的字段一律留着，见 normalize
    o.id = e.id || uid();
    o.date = String(e.date).slice(0, 10);
    o.start = String(e.start).slice(0, 5);
    o.end = String(e.end || '').slice(0, 5);
    o.title = String(e.title || '未命名').slice(0, 200);
    o.note = String(e.note || '').slice(0, 500);
    o.color = e.color || 'blue';
    o.important = !!e.important;
    o.done = !!e.done;
    if (!o.end || toMin(o.end) <= toMin(o.start)) o.end = minToTime(toMin(o.start) + 60);
    if (e.courseId) {
      o.courseId = e.courseId;
      o.slotKey = e.slotKey || '';
      o.originKey = e.originKey || (e.courseId + '|' + o.date + '|' + o.start);
      o.overridden = !!e.overridden;
    }
    return o;
  }

  function normMemo(m) {
    var o = copy(m);              // 不认识的字段一律留着，见 normalize
    o.id = m.id || uid();
    o.date = String(m.date == null ? '' : m.date).slice(0, 10);
    o.text = String(m.text == null ? '' : m.text).trim().slice(0, 300);
    o.done = !!m.done;
    o.createdAt = +m.createdAt || 0;   // 只用来排序，不显示
    return o;
  }

  function normCourse(c) {
    var o = copy(c);              // 不认识的字段一律留着，见 normalize
    o.id = c.id || uid();
    o.name = String(c.name).slice(0, 60);
    o.teacher = String(c.teacher || '').slice(0, 40);
    o.location = String(c.location || '').slice(0, 60);
    o.color = c.color || 'blue';
    o.fromWeek = Math.max(1, +c.fromWeek || 1);
    o.toWeek = Math.max(1, +c.toWeek || 16);
    o.parity = (c.parity === 'odd' || c.parity === 'even') ? c.parity : 'all';
    // 显式周次列表，非空时优先于 fromWeek/toWeek/parity。
    // 课表里大量出现「第2周」「7-9周(单)」「2周,5-15周」这种写法，区间表达不了。
    o.weeks = Array.isArray(c.weeks) ? parseWeeks(c.weeks.join(',')) : [];
    o.excludeDates = Array.isArray(c.excludeDates) ? c.excludeDates : [];
    o.slots = Array.isArray(c.slots) ? c.slots.filter(function (s) {
      return s && s.weekday >= 1 && s.weekday <= 7 && s.from >= 1;
    }).map(function (s) {
      var t = copy(s);
      t.weekday = +s.weekday;
      t.from = +s.from;
      t.to = Math.max(+s.from, +s.to);
      return t;
    }) : [];
    return o;
  }

  /* ── 事件读写 ────────────────────────────────────────────── */

  function byStart(a, b) { return toMin(a.start) - toMin(b.start); }

  /** 某天的日程，按开始时间排序 */
  function eventsOn(dateStr) {
    return state.events.filter(function (e) { return e.date === dateStr; }).sort(byStart);
  }

  function getEvent(id) {
    for (var i = 0; i < state.events.length; i++) if (state.events[i].id === id) return state.events[i];
    return null;
  }

  function addEvent(data) {
    var ev = normEvent(data);
    state.events.push(ev);
    commit();
    return ev;
  }

  function updateEvent(id, patch) {
    var ev = getEvent(id);
    if (!ev) return null;
    var onlyDone = true;
    for (var k in patch) {
      if (!Object.prototype.hasOwnProperty.call(patch, k)) continue;
      // 比的是「值有没有变」，不是「有没有传这个字段」——
      // 编辑弹窗保存时会把所有字段原样再传一遍。
      if (k !== 'done' && ev[k] !== patch[k]) onlyDone = false;
      ev[k] = patch[k];
    }
    // 课程事件被手动改过：保留 courseId 用于去重，但标记 overridden 防止被覆盖。
    // 单纯勾掉「完成」不算改过——否则勾一节高数就会让它脱离课程表。
    if (ev.courseId && !onlyDone) ev.overridden = true;
    var fixed = normEvent(ev);
    for (var k2 in fixed) ev[k2] = fixed[k2];
    commit();
    return ev;
  }

  /** 只改完成状态，绕开 overridden 那套（勾掉一节课不该让它脱离课程表） */
  function setEventDone(id, done) {
    var ev = getEvent(id);
    if (!ev) return null;
    ev.done = !!done;
    commit();
    return ev;
  }

  function toggleEventDone(id) {
    var ev = getEvent(id);
    if (!ev) return null;
    return setEventDone(id, !ev.done);
  }

  function removeEvent(id) {
    var ev = getEvent(id);
    if (!ev) return false;
    // 删掉课程生成的事件时记一笔，避免「生成到日历」又把它加回来
    if (ev.courseId && !ev.overridden) {
      var key = ev.originKey || (ev.courseId + '|' + ev.date + '|' + ev.start);
      if (state.settings.skipped.indexOf(key) === -1) state.settings.skipped.push(key);
    }
    state.events = state.events.filter(function (e) { return e.id !== id; });
    commit();
    return true;
  }

  /* ── 备忘录（每天的小提醒）────────────────────────────────
     和日程的区别：没有时间、不进月历格子、不参与课程表生成。
     只是一句话 + 一个「做没做」，所以单独存一份。            */

  /** 某天的备忘录：未完成的在前，同组按创建先后 */
  function memosOn(dateStr) {
    return state.memos.filter(function (m) { return m.date === dateStr; })
      .sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      });
  }

  function getMemo(id) {
    for (var i = 0; i < state.memos.length; i++) if (state.memos[i].id === id) return state.memos[i];
    return null;
  }

  function addMemo(data) {
    var m = normMemo(data);
    if (!m.date || !m.text) return null;
    if (!m.createdAt) m.createdAt = Date.now();
    state.memos.push(m);
    commit();
    return m;
  }

  function updateMemo(id, patch) {
    var m = getMemo(id);
    if (!m) return null;
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) m[k] = patch[k];
    var fixed = normMemo(m);
    fixed.id = id;
    for (var k2 in fixed) m[k2] = fixed[k2];
    commit();
    return m;
  }

  function removeMemo(id) {
    var before = state.memos.length;
    state.memos = state.memos.filter(function (m) { return m.id !== id; });
    if (state.memos.length === before) return false;
    commit();
    return true;
  }

  function toggleMemo(id) {
    var m = getMemo(id);
    if (!m) return null;
    m.done = !m.done;
    commit();
    return m;
  }

  /** 某天还剩几件没做（提醒 + 日程一起算） */
  function openCount(dateStr) {
    var n = 0;
    state.memos.forEach(function (m) { if (m.date === dateStr && !m.done) n++; });
    state.events.forEach(function (e) { if (e.date === dateStr && !e.done) n++; });
    return n;
  }

  /* ── 节次 ────────────────────────────────────────────────── */

  /** 第 from..to 节合并后的起止时间 */
  function periodRange(from, to) {
    var ps = state.periods;
    var a = ps[from - 1], b = ps[(to || from) - 1];
    if (!a || !b) return null;
    return { start: a.start, end: b.end };
  }

  /* ── 课程 → 事件 ─────────────────────────────────────────── */

  /** 某日期属于第几教学周；未设学期起始则返回 0 */
  function weekNumber(dateStr) {
    var ts = state.settings.termStart;
    if (!ts) return 0;
    var base = mondayOf(parseYmd(ts));
    var d = parseYmd(dateStr);
    return Math.floor((d - base) / 86400000 / 7) + 1;
  }

  /** 这门课实际要上的教学周列表（已排序去重） */
  function activeWeeks(course) {
    if (course.weeks && course.weeks.length) return course.weeks;

    var from = Math.min(course.fromWeek, course.toWeek);
    var to = Math.max(course.fromWeek, course.toWeek);
    var arr = [];
    for (var w = from; w <= to; w++) {
      if (course.parity === 'odd' && w % 2 === 0) continue;
      if (course.parity === 'even' && w % 2 === 1) continue;
      arr.push(w);
    }
    return arr;
  }

  /** 把一门课展开成事件数组（不写入 state） */
  function expandCourse(course) {
    var out = [];
    var ts = state.settings.termStart;
    if (!ts || !course.slots.length) return out;

    var base = mondayOf(parseYmd(ts));
    var excluded = {};
    state.settings.excludeDates.forEach(function (d) { excluded[d] = 1; });
    (course.excludeDates || []).forEach(function (d) { excluded[d] = 1; });
    var skipped = {};
    state.settings.skipped.forEach(function (k) { skipped[k] = 1; });

    var weeks = activeWeeks(course);

    course.slots.forEach(function (slot) {
      for (var i = 0; i < weeks.length; i++) {
        var w = weeks[i];
        var date = addDays(base, (w - 1) * 7 + (slot.weekday - 1));
        var ds = ymd(date);
        if (excluded[ds]) continue;

        var key = course.id + '|' + ds + '|' + slot.weekday + '-' + slot.from + '-' + slot.to;
        if (skipped[key]) continue;

        var rng = periodRange(slot.from, slot.to);
        if (!rng) continue;

        out.push({
          id: uid(),
          date: ds,
          start: rng.start,
          end: rng.end,
          title: course.name,
          note: [course.teacher, course.location].filter(Boolean).join(' · '),
          color: course.color,
          important: false,
          courseId: course.id,
          slotKey: slot.weekday + '-' + slot.from + '-' + slot.to,
          originKey: key
          // 不存教学周号：它由 date + termStart 推算（见 weekNumber），
          // 存下来反而会在改学期起点后悄无声息地变旧。
        });
      }
    });
    return out;
  }

  /**
   * 重新生成全部课程事件。
   * 规则：课程产生的事件随身携带 originKey；被手动改过的（overridden）
   * 原样保留，同 originKey 的新事件不再插入——这样「调课」不会被冲掉。
   */
  function regenerateCourses() {
    var keep = {};
    var done = {};   // originKey → 已勾掉，重新生成时原样带回来
    state.events.forEach(function (e) {
      if (!e.courseId) return;
      if (e.overridden) { keep[e.originKey] = 1; return; }
      if (e.done) done[e.originKey] = 1;
    });

    state.events = state.events.filter(function (e) {
      return !e.courseId || e.overridden;
    });

    var added = 0;
    state.courses.forEach(function (c) {
      expandCourse(c).forEach(function (ev) {
        if (keep[ev.originKey]) return;
        if (done[ev.originKey]) ev.done = true;
        state.events.push(ev);
        added++;
      });
    });

    commit();
    return added;
  }

  /** 清空所有由课程表生成的日程（保留手动加的） */
  function clearCourseEvents() {
    var before = state.events.length;
    state.events = state.events.filter(function (e) { return !e.courseId; });
    commit();
    return before - state.events.length;
  }

  /** 生成后再算一遍：某门课在整个学期会产生多少节课 */
  function countCourse(course) {
    return expandCourse(course).length;
  }

  /* ── 课程读写 ────────────────────────────────────────────── */

  function getCourse(id) {
    for (var i = 0; i < state.courses.length; i++) if (state.courses[i].id === id) return state.courses[i];
    return null;
  }

  function addCourse(data) {
    var c = normCourse(data);
    if (!c.id || getCourse(c.id)) c.id = uid();
    state.courses.push(c);
    commit();
    return c;
  }

  function updateCourse(id, patch) {
    var c = getCourse(id);
    if (!c) return null;
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) c[k] = patch[k];
    var fixed = normCourse(c);
    fixed.id = id;
    for (var k2 in fixed) c[k2] = fixed[k2];
    commit();
    return c;
  }

  function removeCourse(id) {
    state.courses = state.courses.filter(function (c) { return c.id !== id; });
    state.events = state.events.filter(function (e) { return e.courseId !== id; });
    commit();
  }

  /** 把若干格子（weekday + 节次范围）批量写进课程 */
  function setSlotsFor(courseId, newSlots) {
    var c = getCourse(courseId);
    if (!c) return;
    var map = {};
    c.slots.forEach(function (s) { map[s.weekday + '-' + s.from + '-' + s.to] = s; });
    newSlots.forEach(function (s) { map[s.weekday + '-' + s.from + '-' + s.to] = s; });
    c.slots = Object.keys(map).map(function (k) { return map[k]; });
    commit();
  }

  function removeSlots(courseId, slots) {
    var c = getCourse(courseId);
    if (!c) return;
    var kill = {};
    slots.forEach(function (s) { kill[s.weekday + '-' + s.from + '-' + s.to] = 1; });
    c.slots = c.slots.filter(function (s) { return !kill[s.weekday + '-' + s.from + '-' + s.to]; });
    commit();
  }

  /** 清掉某一格上的所有课程 */
  function clearCells(cells) {
    var kill = {};
    cells.forEach(function (c) { kill[c.weekday + '-' + c.from + '-' + c.to] = 1; });
    state.courses.forEach(function (course) {
      course.slots = course.slots.filter(function (s) {
        return !kill[s.weekday + '-' + s.from + '-' + s.to];
      });
    });
    commit();
  }

  /* ── 导入 / 导出 ─────────────────────────────────────────── */

  /** 给人看的备份：带缩进，好读好改 */
  function exportJSON() { return JSON.stringify(state, null, 2); }

  /** 发给云端的：不带缩进。一份学期数据 91KB → 64KB，
     而且远程看 diff 时也还看得懂，不用为了省字节转成 ASCII 转义。 */
  function serialize() { return JSON.stringify(state); }

  function importJSON(text) {
    var s = JSON.parse(text);
    state = normalize(s);
    commit();
    return state;
  }

  function replaceAll(s) { state = normalize(s); commit(); return state; }

  /* ── 导出 API ────────────────────────────────────────────── */

  return {
    PALETTE: PALETTE,
    DEFAULT_PERIODS: DEFAULT_PERIODS,
    WEEKDAY_CN: WEEKDAY_CN,
    KEY: KEY,
    UIKEY: UIKEY,
    VERSION: VERSION,

    get state() { return state; },
    get settings() { return state.settings; },
    get ui() { return ui; },

    pad: pad, ymd: ymd, parseYmd: parseYmd, addDays: addDays,
    mondayOf: mondayOf, weekdayIndex: weekdayIndex,
    toMin: toMin, minToTime: minToTime, uid: uid, esc: esc,
    parseWeeks: parseWeeks, formatWeeks: formatWeeks,
    colorHex: colorHex, rgba: rgba, applyColors: applyColors, isDark: isDark,

    load: load, save: save, commit: commit, onChange: onChange,
    adopt: adopt, setWriter: setWriter,
    loadUi: loadUi, saveUi: saveUi,
    normalize: normalize, defaultState: defaultState,

    eventsOn: eventsOn, getEvent: getEvent, addEvent: addEvent,
    updateEvent: updateEvent, removeEvent: removeEvent,
    setEventDone: setEventDone, toggleEventDone: toggleEventDone,

    memosOn: memosOn, getMemo: getMemo, addMemo: addMemo,
    updateMemo: updateMemo, removeMemo: removeMemo, toggleMemo: toggleMemo,
    openCount: openCount,

    periodRange: periodRange, weekNumber: weekNumber,
    activeWeeks: activeWeeks,
    expandCourse: expandCourse, regenerateCourses: regenerateCourses,
    clearCourseEvents: clearCourseEvents, countCourse: countCourse,

    getCourse: getCourse, addCourse: addCourse, updateCourse: updateCourse,
    removeCourse: removeCourse, setSlotsFor: setSlotsFor,
    removeSlots: removeSlots, clearCells: clearCells,

    exportJSON: exportJSON, importJSON: importJSON, replaceAll: replaceAll,
    serialize: serialize
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Sched;

</script>
<script>
/* ══════════════════════════════════════════════════════════
   todo.js — 「一条可以勾掉的事」的公共渲染与交互

   备忘录用 memo: 前缀，日程用 event: 前缀。左侧任务栏（tasks.js）和
   当日面板的备忘录区（day.js）共用这一套，免得勾选 / 改名 / 删除
   三处各写一遍。
   ══════════════════════════════════════════════════════════ */

var Todo = (function () {
  'use strict';

  /**
   * @param {object} it  { ref:'memo:xxx', text, sub, done, color }
   *                     ref 形如 「类型:id」，交给下面的 split 拆
   */
  function rowHTML(it) {
    return '<div class="todo' + (it.done ? ' done' : '') + '"' +
             ' data-todo="' + Sched.esc(it.ref) + '"' +
             (it.color ? ' data-color="' + Sched.esc(it.color) + '"' : '') + '>' +
             '<input type="checkbox" class="todo-chk" data-todo-toggle' +
               (it.done ? ' checked' : '') + ' aria-label="标记完成">' +
             '<div class="todo-body" data-todo-text title="点击修改">' +
               '<span class="todo-t">' + Sched.esc(it.text) + '</span>' +
               (it.sub ? '<span class="todo-sub">' + Sched.esc(it.sub) + '</span>' : '') +
             '</div>' +
             '<button type="button" class="todo-del" data-todo-del title="删除">✕</button>' +
           '</div>';
  }

  function split(ref) {
    var s = String(ref);
    var i = s.indexOf(':');
    return { kind: s.slice(0, i), id: s.slice(i + 1) };
  }

  function byRef(p) {
    return p.kind === 'memo' ? Sched.getMemo(p.id) : Sched.getEvent(p.id);
  }

  function toggle(ref) {
    var p = split(ref);
    return p.kind === 'memo' ? !!Sched.toggleMemo(p.id) : !!Sched.toggleEventDone(p.id);
  }

  function remove(ref) {
    var p = split(ref);
    if (p.kind === 'memo') return Sched.removeMemo(p.id);

    var e = Sched.getEvent(p.id);
    if (!e) return false;
    if (!confirm('删除日程「' + e.title + '」？')) return false;
    return Sched.removeEvent(p.id);
  }

  function rename(ref, text) {
    var p = split(ref);
    if (p.kind === 'memo') return Sched.updateMemo(p.id, { text: text });
    return Sched.updateEvent(p.id, { title: text });
  }

  /** 就地改名：把文字换成输入框。回车/失焦保存，Esc 放弃。
   *  没改动时不 commit，所以得自己把原内容放回去。 */
  function editInline(el) {
    if (el.querySelector('input')) return;

    var row = el.closest('.todo');
    if (!row) return;
    var ref = row.dataset.todo;
    var p = split(ref);
    var o = byRef(p);
    if (!o) return;

    var orig = p.kind === 'memo' ? o.text : o.title;
    var backup = el.innerHTML;

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'todo-edit';
    input.value = orig;
    input.maxLength = p.kind === 'memo' ? 300 : 200;

    el.textContent = '';
    el.appendChild(input);
    input.focus();
    input.select();

    var closed = false;
    function finish(save) {
      if (closed) return;
      closed = true;
      var v = input.value.trim();
      // 改了才写盘；写盘会触发重画，这一行整个被换掉
      if (save && v && v !== orig) { rename(ref, v); return; }
      el.innerHTML = backup;
    }

    input.addEventListener('keydown', function (ev) {
      ev.stopPropagation();          // 别让全局快捷键吃掉方向键
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', function () { finish(true); });
    input.addEventListener('click', function (ev) { ev.stopPropagation(); });
  }

  /** 在容器上挂一次事件委托；容器里面的 HTML 可以随便重画 */
  function bind(container) {
    container.addEventListener('change', function (ev) {
      var chk = ev.target.closest('[data-todo-toggle]');
      if (!chk) return;
      var row = chk.closest('.todo');
      if (row) toggle(row.dataset.todo);
    });

    container.addEventListener('click', function (ev) {
      var del = ev.target.closest('[data-todo-del]');
      if (del) {
        ev.stopPropagation();
        var row = del.closest('.todo');
        if (row && remove(row.dataset.todo)) App.toast('已删除');
        return;
      }
      var txt = ev.target.closest('[data-todo-text]');
      if (txt) { ev.stopPropagation(); editInline(txt); }
    });
  }

  /** 列表上色：日程用自己的颜色，备忘录统一用中性色 */
  function paint(container) {
    var rows = container.querySelectorAll('.todo[data-color]');
    for (var i = 0; i < rows.length; i++) {
      Sched.applyColors(rows[i], rows[i].dataset.color);
    }
  }

  return { rowHTML: rowHTML, bind: bind, paint: paint };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   sync.js — 云同步：整份数据存进一个私有 GitHub 仓库的
   schedule.json，用 Contents API 直接读写。

   这里只管逻辑，不碰 DOM（界面在 syncui.js），这样才能在 node 里
   用假传输层把各种失败场景全测一遍。

   ── 两条不能动的规矩 ────────────────────────────────────

   1. baseSha 只在两种情况下前进：真的采纳了云端内容，或者自己推送
      成功。**扔掉内容的 GET 绝不能动 baseSha**。否则：轮询拿到别人的
      新 sha 却丢了内容，本地随后一推，带的是那个「新的」sha，
      GitHub 认为没问题，直接把对方整份数据覆盖掉——没有冲突提示、
      没有报错。乐观锁只在「你带的 sha 对应你这次改动所基于的内容」
      时才保护你。

   2. 绝不拿时间戳比谁新。两台设备的时钟不可信，而且时钟慢的那台
      会**永远**推不上去（它写的时间戳总小于刚采纳的云端值）。
      判据只有内容身份：cloudSha !== baseSha 就是冲突，
      「本地有没有没推上去的改动」用本机记的 lastSeq 对比，时钟碰不到。
   ══════════════════════════════════════════════════════════ */

var Sync = (function () {
  'use strict';

  var CFGKEY  = 'schedule.sync';        // 同步配置 + 同步进度（含 token，绝不进 state）
  var DEVKEY  = 'schedule.device';      // 本机标识，断开同步也不该丢
  var LOCKKEY = 'schedule.sync.lock';   // 多标签页选主
  var BAKKEY  = 'schedule.backup.';     // 覆盖前的备份
  var FILE    = 'schedule.json';
  var API     = 'https://api.github.com';
  var APIVER  = '2022-11-28';

  var POLL_MS      = 5 * 60 * 1000;   // 页面开着时的轮询间隔
  var PUSH_IDLE_MS = 20 * 1000;       // 停手这么久才推，免得几百个 commit
  var PUSH_MIN_MS  = 60 * 1000;       // 两次推送之间至少隔这么久
  var LOCK_MS      = 90 * 1000;       // 多标签页选主的租约
  var MAX_BACKUP   = 5;               // 本地最多留几份备份

  /* ── 运行时状态 ──────────────────────────────────────────── */

  var cfg = null;          // { owner, repo, token, baseSha, syncedSeq, pushedSeq, lastSyncAt, lastError }
  var writerId = '';       // 本机标识
  var tabId = uid();       // 本次页面加载的标识（只用于选主）
  var status = { state: 'off', message: '' };
  var watchers = [];       // 状态变化回调，给界面用
  var transport = httpFetch;
  var canAdopt = function () { return true; };
  var selfWrite = false;   // 正在采纳云端内容，别把自己的写入当成用户改动
  var busy = false;        // 一次只跑一个同步动作
  var pending = null;      // 悬而未决的冲突：{ cloud }
  var lastPushAt = 0;
  var failures = 0;        // 连续失败次数，用来退避
  var timers = [];         // 轮询等周期性定时器
  var pushTimer = null;    // 「停手一会儿再推」的延时器
  var started = false;

  function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  /* ── 状态对外播报 ────────────────────────────────────────── */

  function setStatus(state, message) {
    status = { state: state, message: message || '' };
    for (var i = 0; i < watchers.length; i++) {
      try { watchers[i](status); } catch (e) { console.warn(e); }
    }
  }

  function onStatus(fn) { watchers.push(fn); fn(status); }

  /** 出错了：冻结同步，别再后台轮询里一遍遍撞墙 */
  function fail(e) {
    var msg = (e && e.message) || String(e);
    cfg.lastError = msg;
    saveCfg();
    // 认证类错误是「你不改好就永远不会好」，直接停掉自动同步
    var fatal = e && (e.kind === 'auth' || e.kind === 'scope' || e.kind === 'app-older');
    setStatus(fatal ? 'blocked' : 'error', msg);
    if (fatal) stopTimers();
    return e;
  }

  /* ── 配置读写 ────────────────────────────────────────────── */

  function readJSON(key) {
    try {
      var raw = (typeof localStorage !== 'undefined') && localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeJSON(key, val) {
    try {
      if (typeof localStorage === 'undefined') return true;
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) { return false; }
  }

  function saveCfg() {
    if (!cfg) return true;
    return writeJSON(CFGKEY, cfg);
  }

  function isConfigured() {
    return !!(cfg && cfg.owner && cfg.repo && cfg.token);
  }

  /** 设备 id：一次生成，之后一直用。放在自己的键里，断开同步也不重置——
      它不是凭据，它是「这台设备是谁」，换了会让云端认不出自己写的记录。 */
  function initDevice() {
    var d = readJSON(DEVKEY);
    if (!d || !d.writerId) {
      d = { writerId: uid() + uid() };
      writeJSON(DEVKEY, d);
    }
    writerId = d.writerId;
    if (Sched.setWriter) Sched.setWriter(writerId);
    return writerId;
  }

  function configure(opts) {
    cfg = cfg || {};
    if ('owner' in opts) cfg.owner = String(opts.owner || '').trim();
    if ('repo' in opts)  cfg.repo  = String(opts.repo  || '').trim();
    if ('token' in opts) cfg.token = String(opts.token || '').trim();
    if (cfg.syncedSeq === undefined) cfg.syncedSeq = null;
    if (cfg.baseSha === undefined)   cfg.baseSha = '';
    if (cfg.pushedSeq === undefined) cfg.pushedSeq = '';
    cfg.lastError = '';
    failures = 0;
    saveCfg();
    if (isConfigured()) setStatus('idle', '已连接');
    else setStatus('off', '');
    return cfg;
  }

  function disconnect() {
    stopTimers();
    cfg = null;
    if (typeof localStorage !== 'undefined') {
      try { localStorage.removeItem(CFGKEY); localStorage.removeItem(LOCKKEY); } catch (e) {}
    }
    pending = null;
    setStatus('off', '');
  }

  /* ── base64（UTF-8 安全）─────────────────────────────────────
     btoa(JSON.stringify(state)) 是错的：只要有一个中文字符就会抛
     InvalidCharacterError，而这个应用里必然有。          */

  var B64C = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

  function utf8Bytes(str) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    var out = [], i, c, c2;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xD800 && c <= 0xDBFF) {
        c2 = str.charCodeAt(i + 1);
        if (c2 >= 0xDC00 && c2 <= 0xDFFF) {
          c = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
          i++;
          out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63),
                   0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
        } else out.push(0xEF, 0xBF, 0xBD);
      } else if (c >= 0xDC00 && c <= 0xDFFF) out.push(0xEF, 0xBF, 0xBD);
      else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  /** 按 3 字节一组手写，不用 apply、不建大数组，1MB 也不会爆栈 */
  function bytesToB64(bytes) {
    var out = '', i, n = bytes.length, rem = n % 3, main = n - rem, a, b, x;
    for (i = 0; i < main; i += 3) {
      x = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
      out += B64C[(x >> 18) & 63] + B64C[(x >> 12) & 63] +
             B64C[(x >> 6) & 63] + B64C[x & 63];
    }
    if (rem === 1) {
      a = bytes[main];
      out += B64C[a >> 2] + B64C[(a & 3) << 4] + '==';
    } else if (rem === 2) {
      b = (bytes[main] << 8) | bytes[main + 1];
      out += B64C[b >> 10] + B64C[(b >> 4) & 63] + B64C[(b & 15) << 2] + '=';
    }
    return out;
  }

  function strToB64(str) { return bytesToB64(utf8Bytes(str)); }

  function b64ToStr(b64) {
    var bin = atob(String(b64).replace(/\s+/g, ''));
    var i, n = bin.length, bytes = new Uint8Array(n);
    for (i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
    // TextDecoder 默认会把 BOM 吃掉；手写分支就得自己剥，
    // 否则 JSON.parse 会在 ﻿ 上抛错
    if (typeof TextDecoder !== 'undefined') return new TextDecoder('utf-8').decode(bytes);
    var s = '', c, c2, c3, c4, cp;
    i = 0;
    if (n >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) i = 3;
    while (i < n) {
      c = bytes[i++];
      if (c < 0x80) s += String.fromCharCode(c);
      else if (c < 0xE0) s += String.fromCharCode(((c & 31) << 6) | (bytes[i++] & 63));
      else if (c < 0xF0) {
        c2 = bytes[i++];
        s += String.fromCharCode(((c & 15) << 12) | ((c2 & 63) << 6) | (bytes[i++] & 63));
      } else {
        c2 = bytes[i++]; c3 = bytes[i++]; c4 = bytes[i++];
        cp = ((c & 7) << 18) | ((c2 & 63) << 12) | ((c3 & 63) << 6) | (c4 & 63);
        cp -= 0x10000;
        s += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 1023));
      }
    }
    return s;
  }

  /* ── 传输层 ──────────────────────────────────────────────── */

  function httpFetch(req) {
    return fetch(req.url, {
      method: req.method,
      headers: req.headers,
      body: req.body,
      cache: 'no-store'
    }).then(function (res) {
      return res.text().then(function (text) {
        return { status: res.status, text: text };
      });
    });
  }

  function useTransport(fn) { transport = fn; }

  function err(kind, message, status) {
    var e = new Error(message);
    e.kind = kind;
    e.status = status;
    return e;
  }

  function apiUrl() {
    return API + '/repos/' + encodeURIComponent(cfg.owner) + '/' +
           encodeURIComponent(cfg.repo) + '/contents/' + FILE;
  }

  function repoUrl() {
    return API + '/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo);
  }

  function headers() {
    return {
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': APIVER,
      'Content-Type': 'application/json'
    };
  }

  /**
   * 把 HTTP 状态翻译成人话。
   * 这里的每个分支都有实际来历：
   *  - 私有仓库**没权限时 GitHub 也返回 404**（故意不区分「不存在」和「没权限」）
   *  - 仓库还没有任何提交时，PUT 会返回 409 + "Git Repository is empty."
   *  - 文件不存在却带了 sha 去 PUT，返回的是 422，不是 409
   *  - 权限给少了（只读）GET 正常、只有 PUT 才 403
   */
  function classify(res, body) {
    var msg = (body && body.message) || '';
    var s = res.status;

    if (s === 200 || s === 201) return null;
    if (s === 401) return err('auth', 'Token 无效或已过期，请重新生成一个填进来', s);
    if (s === 403) {
      if (/rate limit/i.test(msg)) return err('rate', 'GitHub 接口调用次数超了，稍后会自动重试', s);
      return err('scope', 'Token 权限不够：需要对该仓库的 Contents 读写权限', s);
    }
    if (s === 404) return err('missing', '找不到仓库或文件——私有仓库没授权时 GitHub 也会返回 404，请检查仓库名和 Token 的授权范围', s);
    if (s === 409) {
      if (/empty/i.test(msg)) {
        // 没有任何提交的仓库，Contents API 建不了文件——不是权限也不是网络问题，
        // 得先有一个提交。让提示直接指向那个动作，别让用户去猜。
        return err('repo-empty', '仓库还没有任何提交，这样的仓库没法直接写文件。' +
          '去 GitHub 仓库页面点 Add file → Create new file，名字填 README.md，' +
          '提交一次，再回来同步就好了。', s);
      }
      return err('conflict', '云端文件在你操作期间被改过', s);
    }
    if (s === 422) return err('stale-sha', '本地记录的版本对不上云端文件', s);
    if (s === 304) return err('not-modified', '', s);
    return err('http', 'GitHub 返回了 ' + s + (msg ? '：' + msg : ''), s);
  }

  function parse(text) {
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  function request(method, url, payload) {
    return transport({
      method: method,
      url: url,
      headers: headers(),
      body: payload ? JSON.stringify(payload) : undefined
    }).then(function (res) {
      var body = parse(res.text) || {};
      var e = classify(res, body);
      if (e) throw e;
      return body;
    });
  }

  /* ── 仓库探测 / 拉取 / 推送 ───────────────────────────────── */

  /** 仓库本身能不能访问到——用来把「文件还没建」和「根本进不去」分开 */
  function probeRepo() {
    return transport({ method: 'GET', url: repoUrl(), headers: headers() })
      .then(function (res) {
        if (res.status === 200) return true;
        if (res.status === 404) {
          throw err('missing', '访问不到仓库 ' + cfg.owner + '/' + cfg.repo +
            '。两种可能：名字写错了，或者 Token 没有授权到这个仓库（私有仓库没授权时 GitHub 也返回 404）。');
        }
        var e = classify(res, parse(res.text) || {});
        throw e || err('http', '仓库探测失败');
      });
  }

  /** @returns Promise<null|{sha,state,text}> */
  function fetchCloud() {
    return transport({ method: 'GET', url: apiUrl(), headers: headers() })
      .then(function (res) {
        if (res.status === 404) return null;          // 文件还没建，属于正常情况
        var body = parse(res.text) || {};
        var e = classify(res, body);
        if (e) throw e;

        // 内容超出内联上限时 GitHub 返回 encoding:"none" 且 content 为空。
        // 这里**绝不能**把它当成空数据——那会直接抹掉一整个日历。
        if (body.encoding === 'none' || (!body.content && body.size > 0)) {
          throw err('too-big', '云端的 schedule.json 太大（' +
            Math.round((body.size || 0) / 1024) + ' KB），超出接口能内联的上限，同步先停住。');
        }

        var text = b64ToStr(body.content || '');
        var obj;
        try { obj = JSON.parse(text); }
        catch (e2) {
          throw err('bad-cloud', '云端文件不是合法的 JSON，同步停住，没有动它——' +
            '你可以去仓库的历史记录里找回上一版。');
        }
        return { sha: body.sha, state: obj, text: text };
      });
  }

  function countItems(s) {
    if (!s) return 0;
    return (s.events ? s.events.length : 0) +
           (s.memos ? s.memos.length : 0) +
           (s.courses ? s.courses.length : 0);
  }

  /** 推送。sha 为空表示「新建文件」。 */
  function sendCloud(text, sha, message) {
    var payload = {
      message: message || ('日程同步 ' + new Date().toISOString().slice(0, 16).replace('T', ' ')),
      content: strToB64(text)
    };
    if (sha) payload.sha = sha;

    return request('PUT', apiUrl(), payload).then(function (body) {
      return (body.content && body.content.sha) || '';
    });
  }

  /* ── 备份：任何「要丢掉一份数据」的动作之前都得先留一份 ────── */

  function backupKeys() {
    var out = [];
    if (typeof localStorage === 'undefined') return out;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(BAKKEY) === 0) out.push(k);
    }
    out.sort();
    return out;
  }

  /**
   * 备份一份状态。写不进去就返回 false——调用方**必须**因此中止
   * 破坏性操作（fail closed），不能因为备份失败反而继续覆盖。
   */
  function stash(reason, snapshot) {
    var key = BAKKEY + Date.now();
    var ok = writeJSON(key, { reason: reason, at: Date.now(), state: snapshot });
    if (!ok) return null;
    var keys = backupKeys();
    while (keys.length > MAX_BACKUP) {
      try { localStorage.removeItem(keys.shift()); } catch (e) {}
    }
    return key;
  }

  /** 最近一份备份，给界面提供「下载备份」用 */
  function lastBackup() {
    var keys = backupKeys();
    if (!keys.length) return null;
    return { key: keys[keys.length - 1], data: readJSON(keys[keys.length - 1]) };
  }

  /* ── 判定 ────────────────────────────────────────────────── */

  /**
   * 云端这份和本地这份，该怎么办。判据只有两项：
   *   cloud.sha === cfg.baseSha  → 云端就是我同步过的那份，本地推上去即可
   *   dirty（本机记录的 lastSeq 对不上）→ 本地有没推上去的改动
   * 没有时间戳参与，时钟错乱也影响不到。
   */
  function decide(cloud) {
    var clean = !!cloud && cloud.sha === cfg.baseSha;
    var localHasData = countItems(Sched.state) > 0;
    // 「本地有没推上去的改动」= 本机记的 lastSeq 对不上 + 本地确实有东西。
    // 后半个条件不能少：新设备本地是空的、lastSeq 是空串，跟 syncedSeq
    // 的 null 一比就成了「有改动」，于是永远采纳不了云端。
